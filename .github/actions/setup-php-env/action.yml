name: 'Setup PHP Environment'
description: 'Standard IBL5 PHP CI setup: shivammathur/setup-php + optional vendor cache, config.php, and composer install.'
inputs:
  php-version:
    description: 'PHP version passed to shivammathur/setup-php.'
    required: false
    default: '8.5'
  extensions:
    description: 'Comma-separated PHP extensions for shivammathur/setup-php. Empty string installs none beyond PHP defaults.'
    required: false
    default: 'mbstring, intl, mysqli'
  coverage:
    description: 'Coverage driver (none|pcov|xdebug).'
    required: false
    default: 'none'
  cache:
    description: "Restore/save the ibl5/vendor cache when 'true'."
    required: false
    default: 'true'
  create-config:
    description: "Copy config.php.example to config.php and write config.local.php from DB_* env (defaults 127.0.0.1/root/root/ibl5) in ibl5/ when 'true'."
    required: false
    default: 'true'
  install:
    description: "Run 'composer install --no-progress --no-interaction' in ibl5/ when 'true'."
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # master
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: ${{ inputs.coverage }}

    - name: Cache vendor directory
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ibl5/vendor
        key: ${{ runner.os }}-vendor-${{ hashFiles('ibl5/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-vendor-

    - name: Create config.php
      if: inputs.create-config == 'true'
      shell: bash
      working-directory: ibl5
      run: |
        cp config.php.example config.php
        # config.php requires the gitignored config.local.php for DB credentials
        # (no getenv() fallback). Job-level DB_* env overrides; the defaults match
        # the step-scoped DB_* blocks in tests.yml and mutation.yml.
        printf '<?php\n$dbhost = %s;\n$dbuname = %s;\n$dbpass = %s;\n$dbname = %s;\n' \
          "'${DB_HOST:-127.0.0.1}'" "'${DB_USER:-root}'" "'${DB_PASS:-root}'" \
          "'${DB_NAME:-ibl5}'" > config.local.php

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      working-directory: ibl5
      run: composer install --no-progress --no-interaction
