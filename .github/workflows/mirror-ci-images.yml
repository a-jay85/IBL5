name: Mirror CI images

# Copies the Docker Hub images CI uses (.github/ci-image-mirror.txt) to
# ghcr.io/a-jay85/mirror/<name>:<tag>. Called with only-missing by each consumer
# workflow's mirror-ready job, so a missing or deleted mirror self-heals before
# any job pulls it. The weekly and master-push runs re-copy every ref.
# A called run probes first and skips Buildx setup and the copy when every
# ref already resolves.
on:
  workflow_call:
    inputs:
      only-missing:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      only-missing:
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [master]
    paths:
      - '.github/ci-image-mirror.txt'
      - '.github/workflows/mirror-ci-images.yml'
      - 'bin/ci-image-mirror'

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror CI images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Every consumer workflow calls this file from its own mirror-ready job, so a
      # head SHA can run it several times. The probe makes every call after the first
      # a login plus one inspect per ref: Buildx setup (a BuildKit pull from Docker
      # Hub) and the copy run only when a ref is missing. The probe runs only when
      # only-missing is true: schedule and push runs have no such input, and a
      # dispatch defaults it to false, so those re-copy every ref.
      - name: Probe mirror refs
        id: probe
        if: ${{ inputs.only-missing }}
        run: |
          rc=0
          bin/ci-image-mirror --check || rc=$?
          case "$rc" in
            0) echo "all-present=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "all-present=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
      - name: Set up Docker Buildx
        if: steps.probe.outputs.all-present != 'true'
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Mirror images
        if: steps.probe.outputs.all-present != 'true'
        env:
          ONLY_MISSING: ${{ inputs.only-missing }}
        run: |
          if [ "$ONLY_MISSING" = "true" ]; then
            bin/ci-image-mirror --only-missing
          else
            bin/ci-image-mirror
          fi
