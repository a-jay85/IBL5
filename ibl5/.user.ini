; Upload limits for .sco file parsing (some files exceed 300MB)
upload_max_filesize = 512M
post_max_size = 512M
max_execution_time = 30
memory_limit = 512M
max_file_uploads = 200
; Defense-in-depth: stop PHP from capturing call arguments into exception traces at
; construction time, which also covers the admin-gated HTML trace renders in
; ibl5/scripts/updateAllTheThings.php:102,296.
; The primary defense is ErrorHandlerRegistrar::buildArgFreeTrace() — that one holds
; even where .user.ini is not honored (mod_php), so do not remove it in favor of this.
zend.exception_ignore_args = 1
