name: Production DB Backup

# Daily logical dump of the production database, alongside the existing
# iblhoops.net sim-file replication. Each run:
#   1. dumps prod -> gzip -> ~/backups/db/ibl5-<date>.sql.gz on the prod host,
#   2. rotates to the most recent 14 daily dumps,
#   3. pulls the just-produced dump back and PROVES it is restorable by
#      restoring into an ephemeral MariaDB service and asserting row counts.
#   4. only after step 3 passes, purges auth_users_audit_log rows older than
#      DataRetentionService::AUDIT_LOG_RETENTION_DAYS on prod
#      (php ibl5/bin/purge-audit-log, backlog#1258). The dry_run input turns
#      this into a count-only run.
#
# "The backup works" is therefore a CI assertion, not a hope.
#
# Failure notification reuses the IBLbot Discord-DM pattern from main.yml /
# smoke-prod.yml. The notify job always uses the real secrets.HOST so that a
# forced-bad backup host (dispatch input) still delivers the alert.
#
# WHY THE DUMP RUNS SERVER-SIDE OVER SSH: production MySQL is not reachable
# directly from GitHub-hosted runners. It is firewalled to allowlisted IPs (a dev
# laptop connecting with the .env REMOTE_* creds), so no runner can open a client
# connection to it. Any CI job that needs prod data must SSH to the prod host and
# run mariadb-dump there, authenticating with the host's local socket / .my.cnf,
# then stream or scp the output back — the shape this workflow uses below
# (secrets.PRIVATE_KEY -> ~/.ssh/id_deploy, then ssh -p $PORT -i ~/.ssh/id_deploy).
# That needs only the existing HOST / PORT / USERNAME / PRIVATE_KEY secrets; the
# repo's unreferenced DB_HOST / DB_USER / DB_PASS / DB_NAME secrets are NOT a
# prod-DB path and adding DB-credential secrets would not help.
#
# Same constraint drives the Deploy Rehearsal prod-clone gate (ADR-0059,
# bin/rehearsal-prod-dump).

on:
  schedule:
    # 07:30 UTC daily — offset from the other crons (smoke-prod 08:00,
    # lighthouse/mutation/etc.) to avoid contention.
    - cron: '30 7 * * *'

  workflow_dispatch:
    inputs:
      ssh_host_override:
        description: >-
          Override the backup SSH host (leave blank to use the real prod host).
          Set to a bogus value to exercise the failure-notification path.
        required: false
        default: ''
      dry_run:
        description: 'Skip the dump; print the capture decision only'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prod-db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump, rotate, and verify restore
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Ephemeral MariaDB used only for the restore self-test.
    services:
      verify-db:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Backup host is overridable via dispatch input for failure testing.
      BACKUP_HOST: ${{ github.event.inputs.ssh_host_override || secrets.HOST }}
      REMOTE_DATABASE: iblhoops_ibl5
      # Tables whose exact pre-dump COUNT(*) on prod must be matched or exceeded
      # by the restored dump (bin/lib/restore-rowcount-compare.sh). Space-separated.
      ROWCOUNT_TABLES: >-
        ibl_box_scores ibl_box_scores_teams ibl_plr_snapshots ibl_plb_snapshots
        ibl_events ibl_rcb_season_records ibl_one_on_one ibl_hist ibl_plr
        ibl_team_info ibl_schedule
      # CI writes config.local.php from these four env vars; the duplicate-invariant
      # step below needs them to reach the ephemeral MariaDB holding the restored
      # dump. DB_NAME repeats REMOTE_DATABASE's literal because YAML cannot
      # self-reference within one env: map.
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: iblhoops_ibl5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ github.event.inputs.ssh_host_override || secrets.HOST }}
          port: ${{ secrets.PORT }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Dump prod database, rotate, integrity-check
        id: dump
        run: |
          set -euo pipefail
          REMOTE_FILE="backups/db/ibl5-$(date +%F).sql.gz"
          echo "remote_file=$REMOTE_FILE" >> "$GITHUB_OUTPUT"

          # The row-count helper's functions are piped ahead of the remote
          # script, so prod runs the same bytes bin/test-restore-rowcount-compare
          # tests. Its main is guarded and never runs under bash -s.
          cat bin/lib/restore-rowcount-compare.sh - <<'REMOTE' \
            | ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_deploy \
              ${{ secrets.USERNAME }}@"$BACKUP_HOST" \
              "REMOTE_DATABASE='${REMOTE_DATABASE}' REMOTE_FILE='${REMOTE_FILE}' ROWCOUNT_TABLES='${ROWCOUNT_TABLES}' bash -s" \
            | tee "$RUNNER_TEMP/dump-ssh.log"
            set -euo pipefail
            mkdir -p "$(dirname "$REMOTE_FILE")"

            # Exact pre-dump COUNT(*) per table, printed as ROWCOUNT lines on
            # stdout. A failed count prints ERROR and never stops the dump; the
            # restore step's compare fails the job later instead.
            read -r -a ROWCOUNT_TABLE_LIST <<< "$ROWCOUNT_TABLES"
            rrc_snapshot "$REMOTE_DATABASE" "${ROWCOUNT_TABLE_LIST[@]}" \
              || echo "WARN: row-count snapshot exited $?; compare will fail" >&2

            # Host has local socket/.my.cnf auth (same as main.yml `mysql -N -e`).
            if command -v mariadb-dump >/dev/null 2>&1; then
              DUMP=mariadb-dump
            else
              DUMP=mysqldump
            fi

            "$DUMP" --single-transaction --skip-lock-tables \
              --routines --triggers "$REMOTE_DATABASE" \
              | gzip > "$REMOTE_FILE"

            # Integrity: gzip stream must be valid.
            gunzip -t "$REMOTE_FILE"

            # Size floor: a real dump is well over 1 MB; anything smaller means
            # the dump produced little/no data.
            SIZE=$(stat -c %s "$REMOTE_FILE" 2>/dev/null || stat -f %z "$REMOTE_FILE")
            echo "Dump size: $SIZE bytes"
            if [ "$SIZE" -lt 1048576 ]; then
              echo "ERROR: dump $REMOTE_FILE is under the 1 MB floor ($SIZE bytes)" >&2
              exit 1
            fi

            # Rotation: keep the 14 most recent daily dumps, delete older.
            ls -1t backups/db/ibl5-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
            echo "Retained dumps:"
            ls -1t backups/db/ibl5-*.sql.gz 2>/dev/null | head -n 14
          REMOTE

          bin/lib/restore-rowcount-compare.sh extract "$RUNNER_TEMP/dump-ssh.log" \
            > "$RUNNER_TEMP/prod-rowcounts.txt"
          echo "Pre-dump prod row counts:"
          cat "$RUNNER_TEMP/prod-rowcounts.txt"

      - name: Pull dump back to runner
        run: |
          set -euo pipefail
          scp -P ${{ secrets.PORT }} -i ~/.ssh/id_deploy \
            ${{ secrets.USERNAME }}@"$BACKUP_HOST":"${{ steps.dump.outputs.remote_file }}" \
            ./prod-dump.sql.gz
          ls -l ./prod-dump.sql.gz

      - name: Restore dump into ephemeral MariaDB and run sanity queries
        run: |
          set -euo pipefail
          DB="$REMOTE_DATABASE"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot \
            -e "CREATE DATABASE IF NOT EXISTS \`$DB\`;"

          echo "Restoring dump into $DB..."
          # Mirror bin/lib/db-helpers.sh db_import_sql: disable FK checks around
          # the restore (the single-pass dump is alphabetically ordered, so FK
          # parents may load after children) and strip DEFINER clauses (the
          # ephemeral server has no matching definer users).
          {
            echo "SET FOREIGN_KEY_CHECKS=0;"
            gunzip -c ./prod-dump.sql.gz | perl -pe 's/ DEFINER=\S+ / /g'
            echo "SET FOREIGN_KEY_CHECKS=1;"
          } | mysql -h 127.0.0.1 -P 3306 -uroot -proot "$DB"

          TEAMS=$(mysql -N -B -h 127.0.0.1 -P 3306 -uroot -proot "$DB" \
            -e "SELECT COUNT(*) FROM ibl_team_info;")
          PLAYERS=$(mysql -N -B -h 127.0.0.1 -P 3306 -uroot -proot "$DB" \
            -e "SELECT COUNT(*) FROM ibl_plr;")
          echo "ibl_team_info rows: $TEAMS"
          echo "ibl_plr rows:       $PLAYERS"

          if [ "$TEAMS" -lt 28 ]; then
            echo "ERROR: expected >= 28 teams, got $TEAMS" >&2
            exit 1
          fi
          if [ "$PLAYERS" -lt 1 ]; then
            echo "ERROR: expected > 0 players, got $PLAYERS" >&2
            exit 1
          fi
          # Restored COUNT(*) must be >= prod's pre-dump COUNT(*) for every
          # ROWCOUNT_TABLES table (captured by step dump). Any FAIL exits 1,
          # which fails the job and fires notify-backup-failure.
          VERIFY_MYSQL="$RUNNER_TEMP/verify-mysql"
          printf '%s\n' '#!/bin/sh' \
            'exec mysql -h 127.0.0.1 -P 3306 -uroot -proot "$@"' > "$VERIFY_MYSQL"
          chmod +x "$VERIFY_MYSQL"
          read -r -a ROWCOUNT_TABLE_LIST <<< "$ROWCOUNT_TABLES"
          ROWCOUNT_MYSQL="$VERIFY_MYSQL" bin/lib/restore-rowcount-compare.sh \
            snapshot "$DB" "${ROWCOUNT_TABLE_LIST[@]}" \
            > "$RUNNER_TEMP/restored-rowcounts.txt"
          bin/lib/restore-rowcount-compare.sh compare \
            "$RUNNER_TEMP/prod-rowcounts.txt" "$RUNNER_TEMP/restored-rowcounts.txt" \
            "${ROWCOUNT_TABLE_LIST[@]}"
          echo "Restore verification passed."

      # After the restore, so a PHP-setup failure can never cost a backup. The
      # restored dump is complete and unsampled, so this all-seasons scan is the
      # host that actually catches the next duplicate, within 24 hours.
      - name: Setup PHP environment
        uses: ./.github/actions/setup-php-env

      - name: Assert no duplicate boxscores in the restored dump
        run: php ibl5/bin/check-boxscore-schedule-run --duplicates-only

      - name: Run full boxscore/schedule audit (warn-only)
        id: boxscore-full-audit
        if: ${{ !cancelled() }}
        run: |
          set +e
          php ibl5/bin/check-boxscore-schedule-run
          AUDIT_RC=$?
          echo "audit_rc=$AUDIT_RC" >> "$GITHUB_OUTPUT"

      - name: Build full-audit Discord message
        if: ${{ !cancelled() && steps.boxscore-full-audit.outputs.audit_rc != '0' && steps.boxscore-full-audit.outputs.audit_rc != '' }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf 'Boxscore/schedule full audit found issues in the nightly prod-DB snapshot.\n\nThis is a monitoring alert, not a job failure. Triage the findings as data debt in a separate unit of work.\n\nRun: %s' "$RUN_URL" > /tmp/discord-msg.txt

      - name: Notify full-audit findings via Discord
        if: ${{ !cancelled() && steps.boxscore-full-audit.outputs.audit_rc != '0' && steps.boxscore-full-audit.outputs.audit_rc != '' }}
        continue-on-error: true
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          ping: 'true'

      - name: Ship phase-snapshot tooling to prod
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_deploy \
            ${{ secrets.USERNAME }}@"$BACKUP_HOST" \
            "mkdir -p ~/.phase-snapshot"
          scp -P ${{ secrets.PORT }} -i ~/.ssh/id_deploy \
            bin/rehearsal-prod-dump \
            bin/phase-snapshot-capture \
            ${{ secrets.USERNAME }}@"$BACKUP_HOST":~/.phase-snapshot/

      - name: Capture phase snapshot
        id: phase_snapshot
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          set -uo pipefail
          DRY="${{ inputs.dry_run && '1' || '0' }}"
          set +e
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_deploy \
            ${{ secrets.USERNAME }}@"$BACKUP_HOST" \
            "REMOTE_DATABASE='${REMOTE_DATABASE}' DRY_RUN='${DRY}' bash ~/.phase-snapshot/phase-snapshot-capture"
          RC=$?
          set -e
          echo "capture_rc=$RC" >> "$GITHUB_OUTPUT"

      - name: Build phase-snapshot failure message
        if: ${{ !cancelled() && steps.phase_snapshot.outputs.capture_rc != '0' && steps.phase_snapshot.outputs.capture_rc != '' }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf 'Phase snapshot capture failed (exit %s).\n\nRun: %s' "${{ steps.phase_snapshot.outputs.capture_rc }}" "$RUN_URL" > /tmp/discord-msg.txt

      - name: Notify phase-snapshot failure via Discord
        if: ${{ !cancelled() && steps.phase_snapshot.outputs.capture_rc != '0' && steps.phase_snapshot.outputs.capture_rc != '' }}
        continue-on-error: true
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          ping: 'true'
          fail-on-delivery: 'false'

  notify-backup-failure:
    name: Notify Backup Failure
    runs-on: ubuntu-latest
    needs: backup
    if: ${{ always() && needs.backup.result == 'failure' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Discord message
        continue-on-error: true
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf 'Production DB backup job FAILED (%s trigger).\n\nThe dump, its restore verification (row floors and the pre-dump row-count comparison), or the boxscore duplicate invariant did not pass. Check the run: %s' "${{ github.event_name }}" "$RUN_URL")
          printf '%s' "$MSG" > /tmp/discord-msg.txt

      - name: Send Discord DM
        continue-on-error: true
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          ping: 'true'
          fail-on-delivery: 'false'

  purge-audit-log:
    name: Purge auth audit log past retention
    runs-on: ubuntu-latest
    needs: backup
    # Never purge without tonight's verified dump of the real host. A dispatch
    # with ssh_host_override backed up some other host, so it must not purge prod.
    if: ${{ needs.backup.result == 'success' && github.event.inputs.ssh_host_override == '' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Run purge-audit-log on prod
        run: |
          set -euo pipefail
          FLAG="${{ inputs.dry_run && '--dry-run' || '' }}"
          ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_deploy \
            ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
            "cd www && if [ -f ibl5/bin/purge-audit-log ]; then php ibl5/bin/purge-audit-log $FLAG; elif [ -f ibl5/bin/migrate ]; then echo 'purge-audit-log: SKIP: script not on prod yet (awaiting promote-to-production)'; else echo 'ERROR: www/ibl5 not found on prod host' >&2; exit 1; fi" \
            | tee "$RUNNER_TEMP/purge.log"
          grep -qE '^purge-audit-log: (DRY RUN: |deleted |SKIP: )' "$RUNNER_TEMP/purge.log"

  notify-purge-failure:
    name: Notify Audit-Log Purge Failure
    runs-on: ubuntu-latest
    needs: purge-audit-log
    if: ${{ always() && needs.purge-audit-log.result == 'failure' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Discord message
        continue-on-error: true
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          printf 'Prod auth audit-log purge FAILED (%s trigger). Tonight'"'"'s verified dump is the restore point. Run: %s' "${{ github.event_name }}" "$RUN_URL" > /tmp/discord-msg.txt

      - name: Send Discord DM
        continue-on-error: true
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
          ping: 'true'
          fail-on-delivery: 'false'
