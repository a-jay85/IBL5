name: 'Notify #dev via Discord webhook'
description: >-
  POST a pre-built message file to the #dev Discord webhook.
inputs:
  message-file:
    description: 'Path to a file holding the already-built message body.'
    required: false
    default: '/tmp/discord-msg.txt'
  webhook-url:
    description: 'The #dev channel webhook URL. Pass secrets.DISCORD_DEV_WEBHOOK_URL.'
    required: true
  ping:
    description: '"true" @mentions the owner on this message. Failure notices only.'
    required: false
    default: 'false'
  fail-on-delivery:
    description: >-
      "true" (default): a message that cannot be delivered turns the job RED
      (loud-fail). "false": warn and continue (soft-fail).
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Send Discord notification
      shell: bash
      env:
        WEBHOOK_URL: ${{ inputs.webhook-url }}
        MSG_FILE: ${{ inputs.message-file }}
        PING: ${{ inputs.ping }}
        FAIL_ON_DELIVERY: ${{ inputs.fail-on-delivery }}
      run: bash "$GITHUB_ACTION_PATH/send.sh"
