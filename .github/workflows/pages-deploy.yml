name: Deploy VR gallery to Pages

# Fired by `gh workflow run` from the jobs that actually push to gh-pages (e2e-tests.yml:
# the `e2e` job after a successful gallery push, and `vr-pages-cleanup` after a prune, blob GC, or migration push),
# so a deploy happens once per real gh-pages content change instead of once per E2E run.
# `workflow_dispatch` is deliberately UNGUARDED: it doubles as the manual recovery path when
# the site is left half-published.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deploys and NEVER cancel an in-flight one (a cancelled deploy can leave the
# site half-published). Concurrent PR/master runs queue and each re-serves the whole tree.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout gh-pages (the durable per-SHA accumulator)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0
          path: pages

      # master's bin/ lands BESIDE pages/, never inside it, so no script ships in the
      # Pages artifact (the upload below takes path: pages only).
      - name: Checkout bin/ from master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /bin/
          path: master-scripts

      # Fail before uploading a tree with a gallery image ref that resolves to no file
      # (for example a _vr-blobs/ blob GC'd under a racing publish). Recovery: let the
      # next cleanup or publish push land, or republish the PR's gallery with
      # `gh workflow run vr-refresh.yml -f pr=<N>`, which re-adds every blob it uses.
      - name: Check gallery image references
        run: master-scripts/bin/check-vr-gallery-refs --root pages

      # Shadow-mode telemetry: report only. upload-pages-artifact tars the tree minus
      # .git and .github, so measure the same set.
      - name: Measure Pages artifact size
        id: size
        run: |
          bytes=$(du -sb --exclude=.git --exclude=.github pages | cut -f1)
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"
          echo "Pages tree: ${bytes} bytes"
          if [ "$bytes" -gt 1073741824 ]; then
            echo "::warning::Pages tree is ${bytes} bytes, over 1 GiB."
          fi

      - name: Upload the whole gh-pages tree as the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Assert a per-SHA gallery serves HTTP 200
        shell: bash
        working-directory: pages
        env:
          ARTIFACT_BYTES: ${{ steps.size.outputs.bytes }}
        run: |
          set -euo pipefail
          base="${{ steps.deployment.outputs.page_url }}"
          base="${base%/}"
          # newest committed <sha>/visual-review/ dir on the checked-out gh-pages tree
          newest=""
          newest_ct=0
          for d in */ ; do
            [ -f "${d}visual-review/index.html" ] || continue
            ct=$(git log -1 --format=%ct -- "$d" 2>/dev/null || echo 0)
            if [ "$ct" -gt "$newest_ct" ]; then newest_ct="$ct"; newest="${d%/}"; fi
          done
          if [ -z "$newest" ]; then
            echo "No <sha>/visual-review/index.html present yet — nothing to assert."
            exit 0
          fi
          url="${base}/${newest}/visual-review/index.html"
          # 20 x 30s = 600s. The old 10 x 20s (200s) window was well under the measured p95 deploy
          # wall-clock of 540s (ci-backlog 7.1 — the whole gh-pages tree re-uploads every deploy), so
          # a run could fail the assert on pure CDN propagation lag while the deployment was already
          # live: run 4061 (2026-08-18) had `deploy-pages` report success at 07:39:43 and still 404'd
          # for the full 200s, then served 200 shortly after. Budget the assert against that p95.
          echo "Asserting HTTP 200 for ${url}"
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
            echo "attempt ${i}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              printf '| artifact_bytes | attempts_to_200 |\n|---|---|\n| %s | %s |\n' "${ARTIFACT_BYTES:-unknown}" "$i" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            [ "$i" -lt 20 ] && sleep 30
          done
          printf '| artifact_bytes | attempts_to_200 |\n|---|---|\n| %s | none in 20 |\n' "${ARTIFACT_BYTES:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::VR gallery did not serve HTTP 200 at ${url} after retries"
          exit 1
