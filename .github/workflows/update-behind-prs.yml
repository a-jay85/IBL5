name: Update BEHIND PRs

on:
  push:
    branches: [master]
    # A master merge is the exact moment every armed PR goes BEHIND, and push events are NOT
    # subject to the schedule-event delay that has been dropping this repo's crons by 6-12h
    # (measured 2026-08-27/28 across all 11 scheduled workflows; repo Actions volume was at
    # its LOWEST on those two days — 950/1054 runs vs 2907 on 08-24 when crons were on time —
    # so our own load is not the cause. The delay is GitHub-side and unreachable from here).
    # Push is therefore the only trigger this workflow can actually rely on.
    #
    # Each pass updates at most ONE PR: the head of the merge line, which is the oldest
    # auto-merge-armed PR that is not conflicted and not red on a required check. Native
    # auto-merge lands the head, and its merge push starts the next pass. That is why one
    # merge no longer fans out across every armed PR. See the ADR-0081 Addendum.
    paths-ignore:
      - '**.md'                      # all markdown docs (covers .claude/rules, ibl5/docs, README, ADRs)
      - '.claude/**'                 # agent rules/skills/commands/memory — never affects app build/test
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - 'LICENSE'
      - '**/LICENSE'
      - '.gitignore'
      - '**/.gitignore'
      - '.gitattributes'
      - 'ibl5/phpstan-baseline-counts.json'
      - 'ibl5/coverage-baseline.json'
  schedule:
    # Head-of-line backstop ONLY. GitHub drops and delays these (see the push block above), so
    # nothing latency-sensitive may depend on them. This tick re-checks the head in case a push
    # pass was cancelled or lost. The all-open-PR freshness sweep is gone.
    #
    # Deliberately OFF the quarter-hour. Do NOT "tidy" this back to '*/15 * * * *' — the odd
    # minutes are load-bearing. GitHub names the top of the hour as the worst window:
    # "The schedule event can be delayed during periods of high loads of GitHub Actions
    # workflow runs. High load times include the start of every hour. If the load is
    # sufficiently high enough, some queued jobs may be dropped. ... To decrease the chance
    # of delay, schedule your workflow to run at a different time of the hour."
    #   https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Update this one PR number. Leave blank to run the head-of-line pass.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Print the head, skips, and queue length. Call neither update-branch nor the comment upsert.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write        # update-branch writes a merge commit onto the PR head branch
  pull-requests: write   # enumerate PRs and invoke the update-branch endpoint

concurrency:
  # A dry-run dispatch gets its own group so it never cancels a live push pass in flight.
  # A named-PR dispatch gets its own group so a manual one-PR update never cancels the
  # head-of-line pass. On push and schedule both inputs are null, so the group is the plain
  # name and a second master merge still cancels the first pass during its coalesce wait.
  group: update-behind-prs${{ inputs.dry_run == true && '-dryrun' || '' }}${{ inputs.pr && '-pr' || '' }}
  cancel-in-progress: true

jobs:
  update-behind:
    name: Keep the merge-line head current
    runs-on: ubuntu-latest
    timeout-minutes: 30   # coalesce wait + mergeability retries only; no CI wait remains
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A master merge starts a run. A second merge inside the wait starts a new run, and
      # cancel-in-progress kills this one. A burst of merges coalesces into one pass at the end.
      - name: Coalesce a burst of master merges
        if: github.event_name == 'push'
        run: sleep 300

      - name: Select the head of the merge line
        id: select
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PR: ${{ inputs.pr }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # A push pass fires while GitHub is still recomputing mergeability for the open-PR
          # set, and it has no next tick: the run after a push is the next master merge. So it
          # gets a longer settle window than the scheduled backstop.
          if [ "$EVENT_NAME" = "push" ]; then UNKNOWN_ATTEMPTS=20; else UNKNOWN_ATTEMPTS=5; fi

          OUT="$RUNNER_TEMP/merge-line.out"
          SUM="$RUNNER_TEMP/merge-line.md"
          args=(--live --repo "$REPO")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$DISPATCH_PR" ]; then
            case "$DISPATCH_PR" in
              *[!0-9]*) echo "::error::pr input must be a PR number, got '$DISPATCH_PR'"; exit 1 ;;
            esac
            args+=(--pr "$DISPATCH_PR")
          fi

          select_line() {
            : > "$SUM"
            bin/merge-line-select "${args[@]}" --summary "$SUM" > "$OUT"
            action=$(sed -n 's/^action=//p' "$OUT")
            head=$(sed -n 's/^head=//p' "$OUT")
          }
          select_line

          # GitHub computes mergeStateStatus/mergeable LAZILY: the batch query often returns
          # UNKNOWN while GitHub recomputes in the background, then a later query returns the
          # real value. Re-query the head until it resolves, so a genuinely BEHIND head that
          # merely got caught mid-compute is not skipped. An UNKNOWN head holds the line: the
          # pass never moves on to a later PR.
          attempt=0
          while [ "$action" = "unknown" ] && [ "$attempt" -lt "$UNKNOWN_ATTEMPTS" ]; do
            attempt=$((attempt + 1))
            sleep 3
            state=$(gh api graphql -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$head" -f query='
              query($owner:String!, $name:String!, $number:Int!) {
                repository(owner:$owner, name:$name) {
                  pullRequest(number:$number) { mergeStateStatus }
                }
              }' --jq '.data.repository.pullRequest.mergeStateStatus' || true)
            if [ -n "$state" ] && [ "$state" != "UNKNOWN" ]; then select_line; fi
          done
          if [ "$action" = "unknown" ]; then
            echo "- Head #$head mergeability still UNKNOWN after $attempt polls. Left for the next tick." >> "$SUM"
          fi

          cat "$OUT"
          cat "$OUT" >> "$GITHUB_OUTPUT"
          cat "$SUM" >> "$GITHUB_STEP_SUMMARY"

      - name: Update the head PR onto master
        if: steps.select.outputs.action == 'update' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
          REPO: ${{ github.repository }}
          HEAD_PR: ${{ steps.select.outputs.head }}
        run: |
          set -euo pipefail

          # Update the branch via merge commit from master. Authenticated as CI_PAT so the
          # resulting push triggers CI on the refreshed branch (GITHUB_TOKEN would not).
          #
          # We do NOT check whether CI is currently in flight on the head. master enforces
          # strict required checks, so a BEHIND PR's running checks cannot satisfy the
          # merge gate no matter how they finish — they are doomed before we look. This
          # push IS the canceller: every required check workflow (tests.yml,
          # e2e-tests.yml, pr-meta-checks.yml, human-signoff.yml) carries
          # cancel-in-progress: true on a ref-keyed concurrency group, so the new head
          # cancels the stale run and starts the only run that can actually merge.
          if gh api -X PUT "repos/$REPO/pulls/$HEAD_PR/update-branch"; then
            echo "- update-branch: PR #$HEAD_PR updated onto master" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::update-branch failed for PR #$HEAD_PR"
            echo "- update-branch: FAILED for PR #$HEAD_PR" >> "$GITHUB_STEP_SUMMARY"
          fi

      # GITHUB_TOKEN, not CI_PAT: editing the notice then fires no issue_comment workflow.
      - name: Post or clear merge-line skip notices
        if: inputs.dry_run != true && !inputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIPPED: ${{ steps.select.outputs.skipped }}
          CLEAR: ${{ steps.select.outputs.clear }}
        run: |
          set -euo pipefail
          source bin/lib/pr-sticky.sh
          MARKER='<!-- merge-line-skip -->'
          for entry in $SKIPPED; do
            n="${entry%%:*}"; reason="${entry#*:}"
            case "$reason" in
              red)   why="a required check is failing on the current head commit"
                     fix="the required checks pass on a new head commit" ;;
              dirty) why="the branch has a merge conflict with master"
                     fix="the conflict is resolved" ;;
              *)     echo "::warning::unknown skip reason '$reason' for #$n"; continue ;;
            esac
            body="$MARKER
          **Merge line: skipped.** This PR is armed for auto-merge, and the merge line passed over it because ${why}.
          It stays armed and keeps its place by arm time. The line picks it up again on the first pass after ${fix}."
            pr_sticky_upsert "$n" "$MARKER" "$body" || echo "::warning::could not post skip notice on #$n"
          done
          for n in $CLEAR; do
            pr_sticky_delete "$n" "$MARKER" || echo "::warning::could not clear skip notice on #$n"
          done
