          echo ""
          echo "=== Application log (last 30 lines) ==="
          docker compose -f docker-compose.ci.yml exec -T php sh -c 'tail -30 /var/www/html/ibl5/logs/*.log 2>/dev/null' || echo "(no app logs)"

      - name: Stop Docker containers
        if: always()
        run: docker compose -f docker-compose.ci.yml down

  merge-reports:
    name: Merge E2E Reports
    needs: [changes, e2e, e2e-shards, e2e-mutators, api-e2e]
    if: always() && needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: node-modules-cache
        with:
          path: ibl5/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('ibl5/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JS dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        working-directory: ibl5
        run: bun install

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: ibl5/all-blob-reports
          merge-multiple: true

      - name: Download visual regression results
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: visual-regression-results
          path: ibl5/visual-results/
        continue-on-error: true

      - name: Download shard test results
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-results-shard-*
          path: ibl5/shard-test-results/
          merge-multiple: true
        continue-on-error: true

      - name: Merge reports
        working-directory: ibl5
        run: |
          npx playwright merge-reports --reporter=html ./all-blob-reports
          npx playwright merge-reports --reporter=json ./all-blob-reports > test-results.json

      - name: Upload merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: ibl5/playwright-report/
          retention-days: 7

      - name: Restore CML cache
        if: always() && github.event_name == 'pull_request'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cml
          key: ${{ runner.os }}-cml-0.20.6

      - name: Install CML (fallback if cache miss)
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ ! -f ~/.cml/node_modules/.bin/cml ]; then
