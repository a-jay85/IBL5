name: PR Fast-Canary

# Advisory early-signal: on each master push, trial-merge latest master into the head of
# every auto-merge-armed PR on the merge line (membership comes from
# `bin/merge-line-select --list`, ADR-0081 Addendum) and run ONLY the cheap checks
# (PHPStan + default-group PHPUnit), skipping the heavy E2E suite. Reports per-PR via a
# sticky comment. NOT a required check — each PR's own `gate` job owns the authoritative
# full-suite gate.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/CODEOWNERS'
      - 'LICENSE'
      - '**/LICENSE'
      - '.gitignore'
      - '**/.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-canary
  cancel-in-progress: true

jobs:
  enumerate:
    name: Enumerate the armed merge line
    runs-on: ubuntu-latest
    permissions:
      contents: read        # checkout, to run bin/merge-line-select
      pull-requests: read   # list PRs and autoMergeRequest
      checks: read          # statusCheckRollup CheckRun contexts in the selector query
      statuses: read        # statusCheckRollup StatusContext contexts
    outputs:
      prs: ${{ steps.list.outputs.prs }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List the armed merge line as a JSON array
        id: list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prs=$(bin/merge-line-select --live --repo "$REPO" --list)
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "count=$(printf '%s' "$prs" | jq 'length')" >> "$GITHUB_OUTPUT"

  canary:
    name: Canary PR #${{ matrix.pr }}
    needs: enumerate
    if: needs.enumerate.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.enumerate.outputs.prs) }}
    steps:
      - name: Checkout master (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
      - name: Setup PHP environment
        uses: ./.github/actions/setup-php-env
      - name: Run fast-canary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/pr-canary-check --pr "${{ matrix.pr }}"
