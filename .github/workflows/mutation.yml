name: Mutation Testing

on:
  # No schedule here. mutation-weekly-dispatch.yml dispatches the weekly run on Sunday,
  # between 3am and 9am America/Los_Angeles, at most once per week
  # (bin/mutation-weekly-dispatch decides).
  workflow_dispatch:
    inputs:
      module:
        description: 'One ibl5/classes entry to mutate alone (e.g. ActivityTracker). Reports its MSI without enforcing the bar. Empty runs every shard.'
        required: false
        default: ''
        type: string
  pull_request:
    types: [labeled]  # per-PR diff job (required check) lives in mutation-pr.yml

permissions:
  contents: read
  packages: read

env:
  # The weekly bar is the full suite's real score, summed over every shard by the
  # aggregate job. infection.json5 keeps 100 for the per-PR diff job. Every weekly
  # score before 2026-10-30 was fake: Infection's temp config could not find the old
  # relative phpunit.xml baseline, so PHPUnit exited 1 and every mutant counted as
  # killed. The first honest run (2026-11-16) scored 71.1%. Raise these as tests improve.
  MUTATION_MIN_MSI: '71'
  MUTATION_MIN_COVERED_MSI: '71'

concurrency:
  # A labeled event for any label other than mutation-test gets its own group, so it never
  # cancels a real mutation-test run on the same ref. post-plan-running and hotfix are the
  # usual ones. The jobs below still skip on those events (same pattern as e2e-tests.yml).
  # A one-module dispatch gets its own group, so it never cancels a full run on the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'mutation-test') && format('-label-{0}', github.run_id) || '' }}${{ (github.event_name == 'workflow_dispatch' && inputs.module != '') && format('-module-{0}', inputs.module) || '' }}
  cancel-in-progress: true

jobs:
  mirror-ready:
    name: Mirror CI images
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'mutation-test')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mirror-ci-images.yml
    with:
      only-missing: true

  shards:
    name: Plan mutation shards
    runs-on: ubuntu-26.04
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'mutation-test')
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expect: ${{ steps.plan.outputs.expect }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check infection excludes
      working-directory: ibl5
      run: bin/check-infection-excludes

    - name: Check shard coverage
      working-directory: ibl5
      run: bin/infection-shards check

    - name: Build shard matrix
      id: plan
      working-directory: ibl5
      env:
        MODULE: ${{ github.event_name == 'workflow_dispatch' && inputs.module || '' }}
      run: |
        if [ -n "$MODULE" ]; then
          matrix=$(bin/infection-shards matrix --module="$MODULE")
        else
          matrix=$(bin/infection-shards matrix)
        fi
        expect=$(jq -r 'map(.shard) | join(",")' <<< "$matrix")
        printf 'matrix=%s\nexpect=%s\n' "$matrix" "$expect" >> "$GITHUB_OUTPUT"

  coverage:
    name: Mutation coverage
    needs: [mirror-ready, shards]
    runs-on: ubuntu-26.04
    # One PHPUnit + pcov run feeds every shard through the mutation-coverage artifact.
    timeout-minutes: 30

    services:
      mariadb:
        image: ghcr.io/a-jay85/mirror/mariadb:10.11
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ibl5
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP environment
      uses: ./.github/actions/setup-php-env
      with:
        extensions: mbstring, intl, mysqli, pcov
        coverage: pcov

    - name: Apply migrations
      working-directory: ibl5
      run: bin/run-migrations-ci -h 127.0.0.1 -u root -proot ibl5

    - name: Import seed data
      working-directory: ibl5
      run: mysql -h 127.0.0.1 -u root -proot ibl5 < tests/DatabaseIntegration/Fixtures/db-seed.sql

    - name: Generate coverage for Infection
      working-directory: ibl5
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASS: root
        DB_NAME: ibl5
      run: |
        mkdir -p coverage
        vendor/bin/phpunit \
          --configuration=phpunit-mutation.xml \
          --coverage-clover coverage/clover.xml \
          --coverage-xml coverage/coverage-xml \
          --log-junit coverage/junit.xml \
          --no-progress

    - name: Upload coverage for shards
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mutation-coverage
        path: ibl5/coverage
        retention-days: 1

  mutation:
    name: Infection PHP ${{ matrix.shard }}
    needs: [mirror-ready, shards, coverage]
    runs-on: ubuntu-26.04
    # 2026-11-16's 52-minute run over 10 shards is about 5 minutes each (an estimate).
    # 120 leaves room for the per-mutant DB tests a sibling plan adds.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.matrix) }}

    services:
      mariadb:
        image: ghcr.io/a-jay85/mirror/mariadb:10.11
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ibl5
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP environment
      uses: ./.github/actions/setup-php-env
      with:
        extensions: mbstring, intl, mysqli, pcov
        coverage: pcov

    - name: Apply migrations
      working-directory: ibl5
      run: bin/run-migrations-ci -h 127.0.0.1 -u root -proot ibl5

    - name: Import seed data
      working-directory: ibl5
      run: mysql -h 127.0.0.1 -u root -proot ibl5 < tests/DatabaseIntegration/Fixtures/db-seed.sql

    - name: Clone per-thread test databases
      # Infection runs 4 threads ("threads": 4 in ibl5/infection.json5) and
      # exports TEST_TOKEN=1..4 to each mutant process. With
      # INFECTION_PER_THREAD_DATABASE set, DatabaseNameResolver sends thread N
      # to ibl5_tN, so threads never share rows, locks or committed fixtures.
      # Each shard job has its own MariaDB service, so every shard clones its own.
      # The dump runs inside the service container, so client and server
      # versions always match.
      run: |
        set -euo pipefail
        docker exec "${{ job.services.mariadb.id }}" mariadb-dump -uroot -proot --routines --triggers --events ibl5 > /tmp/ibl5-seeded.sql
        want=$(mysql -h 127.0.0.1 -u root -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ibl5'")
        if [ "$want" -eq 0 ]; then echo "::error::seeded ibl5 has no tables to clone"; exit 1; fi
        for t in 1 2 3 4; do
          mysql -h 127.0.0.1 -u root -proot -e "DROP DATABASE IF EXISTS ibl5_t$t; CREATE DATABASE ibl5_t$t"
          docker exec -i "${{ job.services.mariadb.id }}" mariadb -uroot -proot "ibl5_t$t" < /tmp/ibl5-seeded.sql
          got=$(mysql -h 127.0.0.1 -u root -proot -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ibl5_t$t'")
          if [ "$got" != "$want" ]; then echo "::error::ibl5_t$t has $got tables, want $want"; exit 1; fi
        done

    - name: Download coverage
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: mutation-coverage
        path: ibl5/coverage

    - name: Run Infection
      working-directory: ibl5
      # Each shard mutates only its slice of classes/ and never fails on score.
      # The aggregate job sums every shard and enforces MUTATION_MIN_MSI once.
      # infection.json5 keeps 100 for the per-PR diff job, so 0 overrides it here.
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASS: root
        DB_NAME: ibl5
        INFECTION_PER_THREAD_DATABASE: '1'
        SHARD_FILTER: ${{ matrix.filter }}
      run: |
        # Infection builds every per-mutant config from ibl5/phpunit.xml and
        # ignores --configuration in testFrameworkOptions. Copy the mutation
        # config over it so mutant runs execute the database group and skip
        # discord-live and mutation-unsafe. Runner-local overwrite only.
        cp phpunit-mutation.xml phpunit.xml
        vendor/bin/infection \
          --configuration=infection.json5 \
          --coverage=coverage \
          --skip-initial-tests \
          --show-mutations \
          --filter="$SHARD_FILTER" \
          --min-msi=0 \
          --min-covered-msi=0 \
          --no-progress

    - name: Check mutation kills are real
      if: always()
      working-directory: ibl5
      # Fails when killed mutants show a runner or setup error instead of a
      # failing test. A separate step keeps the Infection step's exit code as
      # it was, and the upload step below still runs when this one fails.
      run: |
        rc=0
        bin/check-infection-ran --kills infection-report.html \
          > /tmp/kill-check.md || rc=$?
        cat /tmp/kill-check.md
        cat /tmp/kill-check.md >> "$GITHUB_STEP_SUMMARY"
        exit "$rc"

    - name: Upload mutation reports
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mutation-shard-${{ matrix.shard }}
        path: |
          ibl5/infection.log
          ibl5/infection-report.html
          ibl5/infection-summary.log
        retention-days: 14

    - name: Post summary
      if: always()
      working-directory: ibl5
      run: |
        if [ -f infection-summary.log ]; then
          echo "## Mutation Testing Results (${{ matrix.shard }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat infection-summary.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

  aggregate:
    name: Aggregate MSI
    runs-on: ubuntu-26.04
    needs: [shards, coverage, mutation]
    # Runs after a shard fails or times out too, so the summary still shows every shard that finished.
    if: ${{ always() && needs.shards.result == 'success' && needs.coverage.result == 'success' }}
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download shard reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: mutation-shard-*
        path: ${{ runner.temp }}/shard-results

    - name: Enforce the aggregate bar
      working-directory: ibl5
      env:
        EXPECT: ${{ needs.shards.outputs.expect }}
        MODULE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.module != '' }}
      run: |
        report_only=
        if [ "$MODULE_RUN" = "true" ]; then report_only=--report-only; fi
        rc=0
        bin/infection-shards aggregate \
          --dir="$RUNNER_TEMP/shard-results" \
          --expect="$EXPECT" \
          --min-msi="$MUTATION_MIN_MSI" \
          --min-covered-msi="$MUTATION_MIN_COVERED_MSI" \
          $report_only > "$RUNNER_TEMP/aggregate.md" || rc=$?
        cat "$RUNNER_TEMP/aggregate.md"
        cat "$RUNNER_TEMP/aggregate.md" >> "$GITHUB_STEP_SUMMARY"
        exit "$rc"

  notify-mutation-failure:
    name: Notify Mutation Failure
    runs-on: ubuntu-26.04
    needs: [mirror-ready, shards, coverage, mutation, aggregate]
    # A job that hits timeout-minutes ends 'cancelled', not 'failure'. The scheduled run
    # alerts on cancelled too, so a timeout can't go silent (it did on 2026-11-02 and
    # 2026-11-09). Label and dispatch runs stay failure-only: a newer run cancels those.
    # If mirror-ready or coverage times out, later jobs end 'skipped', so the scheduled run checks each job's cancel.
    if: >-
      ${{ always() && (needs.mirror-ready.result == 'failure'
          || needs.shards.result == 'failure'
          || needs.coverage.result == 'failure'
          || needs.mutation.result == 'failure'
          || needs.aggregate.result == 'failure'
          || (github.event_name == 'schedule' && (needs.mirror-ready.result == 'cancelled'
              || needs.coverage.result == 'cancelled'
              || needs.mutation.result == 'cancelled'
              || needs.aggregate.result == 'cancelled'))) }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Discord message
        env:
          MIRROR_RESULT: ${{ needs.mirror-ready.result }}
          MUTATION_RESULT: ${{ needs.mutation.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          AGGREGATE_RESULT: ${{ needs.aggregate.result }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$MIRROR_RESULT" = "cancelled" ]; then
            MSG=$(printf 'Weekly mutation testing never ran (%s trigger).\n\nThe CI image mirror job (mirror-ready) was CANCELLED, most likely by its timeout-minutes cap, so the DB mirror never got ready and Infection was skipped. Check the run: %s' "${{ github.event_name }}" "$RUN_URL")
          elif [ "$MIRROR_RESULT" = "failure" ]; then
            MSG=$(printf 'Weekly mutation testing never ran (%s trigger).\n\nThe CI image mirror job (mirror-ready) FAILED, so the DB mirror never got ready and Infection was skipped. Check the run: %s' "${{ github.event_name }}" "$RUN_URL")
          elif [ "$SHARDS_RESULT" = "failure" ]; then
            MSG=$(printf 'Weekly mutation testing never ran (%s trigger).\n\nThe shard plan job FAILED: an ibl5/classes entry is missing from ibl5/infection-shards.json, or the module input names no shard member. Check the run: %s' "${{ github.event_name }}" "$RUN_URL")
          elif [ "$COVERAGE_RESULT" != "success" ]; then
            MSG=$(printf 'Weekly mutation testing never ran (%s trigger).\n\nThe coverage job ended %s, so no shard ran. Check the run: %s' "${{ github.event_name }}" "$COVERAGE_RESULT" "$RUN_URL")
          elif [ "$MUTATION_RESULT" = "cancelled" ] || [ "$AGGREGATE_RESULT" = "cancelled" ]; then
            MSG=$(printf 'Weekly mutation testing was CANCELLED (%s trigger).\n\nA shard or the aggregate job most likely hit its timeout-minutes cap. Check the run: %s' "${{ github.event_name }}" "$RUN_URL")
          elif [ "$MUTATION_RESULT" = "failure" ]; then
            MSG=$(printf 'Weekly mutation testing FAILED (%s trigger).\n\nA shard'"'"'s Infection run crashed. Shards never fail on score, so this is an error. Check the run: %s' "${{ github.event_name }}" "$RUN_URL")
          else
            MSG=$(printf 'Weekly mutation testing FAILED (%s trigger).\n\nThe aggregate MSI across all shards fell below the %s%% bar, or a shard reported no results. Check the run: %s' "${{ github.event_name }}" "$MUTATION_MIN_MSI" "$RUN_URL")
          fi
          printf '%s' "$MSG" > /tmp/discord-msg.txt

      - name: Send Discord DM
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_ERRORS_WEBHOOK_URL || secrets.DISCORD_DEV_WEBHOOK_URL }}
