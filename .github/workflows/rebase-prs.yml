name: Rebase Open PRs (manual)

# Manual-dispatch ONLY. This is the restored eager-rebase workflow (#1949), minus the
# trigger that got it retired: it used to fire on every push to master, so a single merge
# set off a rebase storm across the whole open-PR set. That auto-trigger is NOT restored
# and must not be. The storm is fine when a human chooses to start it and is watching it
# settle; it is not fine as an automatic consequence of merging.
#
# Cost model, so the operator can judge before clicking Run workflow: each rebased PR gets
# force-pushed, which re-runs that PR's whole CI matrix. The matrix size is per-PR, not fixed
# — 19 of this repo's 33 workflow files listen on `pull_request`, but most carry path filters,
# so a docs-only PR costs far less than one touching PHP. Rather than quote a multiplier that
# would stale, the number the operator actually needs is the PR count: the step summary
# reports it, and `dry_run` reports it (plus the exact orphan drops) without pushing anything.
#
# Relationship to `.github/workflows/update-behind-prs.yml`: that workflow refreshes PRs with
# a MERGE commit via the update-branch API (preserves commits, keeps auto-merge armed); this
# one REBASES and force-pushes (rewrites commits, linear history, drops orphaned stacking
# remnants). ADR-0081 § Alternatives Considered decided the two strategies stay in separate
# files with independent concurrency groups. If both touch a branch at once, the
# `--force-with-lease` below fails safe rather than clobbering.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would be rebased (including orphan drops) without pushing anything'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Distinct from update-behind-prs on purpose: concurrency groups are repo-scoped and the
  # CANCELING run's setting wins, so a shared group would let a scheduled update-behind tick
  # kill a manual rebase mid-flight.
  group: rebase-prs
  # Manual runs queue rather than cancel — a human started this one deliberately.
  cancel-in-progress: false

jobs:
  rebase:
    name: Rebase open PRs onto master
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # CI_PAT is required so that force-pushes trigger pull_request events
          # (pushes via GITHUB_TOKEN are silently ignored by GitHub's anti-recursion guard).
          # This causes each rebased PR to re-run its applicable CI workflows naturally,
          # respecting existing path filters and trigger conditions.
          token: ${{ secrets.CI_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase open PR branches
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # Normalize DRY_RUN so every test below fails SAFE rather than open. A boolean
          # dispatch input should render as the string "true"/"false", but if it ever renders
          # as anything else (empty, "True"), an equality test against "true" would fall
          # through to the branch that writes to PR branches -- the exact opposite of what
          # the operator asked for. Anything that is not an explicit "false" means dry run.
          if [ "$DRY_RUN" != "false" ]; then
            DRY_RUN=true
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "DRY RUN — branches will be rebased locally to prove they apply cleanly, but nothing is pushed."
          fi

          # Get all open PRs targeting master, ordered so that PRs currently
          # passing all their checks rebase (and thus re-enter the CI queue)
          # before PRs with failing/pending checks. A PR is "green" when its
          # status-check rollup has no entry outside SUCCESS/NEUTRAL/SKIPPED
          # (an empty rollup — no checks — also counts as green). sort_by is
          # stable, so relative order within each group is preserved. This is a
          # scheduling-under-contention optimization: when runners are free it's
          # a no-op; when they're scarce, green PRs re-confirm first.
          prs=$(gh pr list --base master --state open \
            --json number,headRefName,statusCheckRollup \
            --jq '
              map(.green = (
                [.statusCheckRollup[]? | (.conclusion // .state)
                  | select(. != "SUCCESS" and . != "NEUTRAL" and . != "SKIPPED")]
                | length == 0
              ))
              | sort_by(.green | not)
              | .[] | "\(.number) \(.headRefName)"')

          if [ -z "$prs" ]; then
            echo "No open PRs targeting master"
            exit 0
          fi

          # --- Phase 1: Fetch all branches and build patch-id sets ---
          # Detects "stacked" branches — branches that carry commits belonging to
          # another open PR branch. Rebasing a stacked branch onto master replays
          # the parent branch's commits as duplicate cherry-picks. We skip stacked
          # branches; they'll be rebased naturally once their parent PR merges.

          branches=()
          pr_numbers=()
          while IFS=' ' read -r pr_number branch; do
            if git fetch origin "$branch" 2>/dev/null; then
              branches+=("$branch")
              pr_numbers+=("$pr_number")
            else
              echo "::warning::Could not fetch branch ${branch}, skipping"
            fi
          done <<< "$prs"

          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT

          for i in "${!branches[@]}"; do
            git format-patch --stdout "origin/master..origin/${branches[$i]}" 2>/dev/null \
              | git patch-id --stable 2>/dev/null \
              | awk '{print $1}' \
              | sort -u > "${tmpdir}/${i}.patches"
          done

          # Branch B is "stacked on" branch A if every patch-id in A also appears
          # in B (strict subset: A ⊂ B). Stacked branches are skipped.
          declare -A stacked_on
          for i in "${!branches[@]}"; do
            b_count=$(wc -l < "${tmpdir}/${i}.patches")
            [ "$b_count" -eq 0 ] && continue
            for j in "${!branches[@]}"; do
              [ "$i" = "$j" ] && continue
              a_count=$(wc -l < "${tmpdir}/${j}.patches")
              [ "$a_count" -eq 0 ] && continue
              [ "$a_count" -ge "$b_count" ] && continue
              common=$(comm -12 "${tmpdir}/${j}.patches" "${tmpdir}/${i}.patches" | wc -l)
              if [ "$common" -eq "$a_count" ]; then
                stacked_on[$i]="${branches[$j]}"
                break
              fi
            done
          done

          # --- Phase 1.5: Detect orphaned stacking remnants ---
          # After a parent branch is squash-merged, its children still carry the
          # parent's individual commits. Git rebase can't drop them because the
          # squash commit has a different patch-id. We detect these orphans by
          # finding patch-ids shared across 2+ branches — those are remnants of
          # a common ancestor that was squash-merged away.
          #
          # This is a HEURISTIC, and its false positive is real: two open PRs that
          # genuinely carry an identical small diff (two dependabot bumps of the same
          # dep, the same one-line fix cherry-picked into both) look exactly like an
          # orphan pair, and the shared commit would be dropped from both. That is what
          # the `dry_run` input is for — every planned drop is printed with its subject
          # line below, so an operator can eyeball the list before authorising a real run.

          # Build patch-id→SHA mapping for each branch (needed for interactive rebase)
          for i in "${!branches[@]}"; do
            git format-patch --stdout "origin/master..origin/${branches[$i]}" 2>/dev/null \
              | git patch-id --stable 2>/dev/null \
              > "${tmpdir}/${i}.pidmap"
          done

          # Count how many branches each patch-id appears in
          declare -A pid_count
          for i in "${!branches[@]}"; do
            [ -n "${stacked_on[$i]:-}" ] && continue
            while read -r pid sha; do
              pid_count[$pid]=$(( ${pid_count[$pid]:-0} + 1 ))
            done < "${tmpdir}/${i}.pidmap"
          done

          # Build per-branch drop lists (SHAs of orphaned commits)
          orphan_total=0
          for i in "${!branches[@]}"; do
            [ -n "${stacked_on[$i]:-}" ] && continue
            : > "${tmpdir}/${i}.drop"
            while read -r pid sha; do
              if [ "${pid_count[$pid]:-0}" -ge 2 ]; then
                echo "$sha" >> "${tmpdir}/${i}.drop"
              fi
            done < "${tmpdir}/${i}.pidmap"
            drop_n=$(wc -l < "${tmpdir}/${i}.drop")
            if [ "$drop_n" -gt 0 ]; then
              echo "Branch ${branches[$i]}: ${drop_n} orphaned commit(s) to drop"
              # Print each one so a dry run is auditable against the heuristic's
              # false positive described above.
              while read -r sha; do
                echo "    $(git log -1 --format='%h %s' "$sha" 2>/dev/null || echo "$sha")"
              done < "${tmpdir}/${i}.drop"
              orphan_total=$((orphan_total + drop_n))
            fi
          done
          [ "$orphan_total" -gt 0 ] && echo "Total orphaned commits to drop: ${orphan_total}"

          # --- Phase 2: Rebase non-stacked branches ---
          rebased=0
          skipped=0
          failed=0
          stacked_count=0
          dropped=0
          would_rebase=0
          push_failed=0

          for i in "${!branches[@]}"; do
            branch="${branches[$i]}"
            pr_number="${pr_numbers[$i]}"
            echo "::group::PR #${pr_number} (${branch})"

            if [ -n "${stacked_on[$i]:-}" ]; then
              echo "Stacked on ${stacked_on[$i]} — skipping to avoid commit duplication"
              ((++stacked_count))
              echo "::endgroup::"
              continue
            fi

            # Check if branch is already up-to-date with master
            merge_base=$(git merge-base "origin/${branch}" origin/master)
            master_sha=$(git rev-parse origin/master)

            drop_n=$(wc -l < "${tmpdir}/${i}.drop")

            if [ "$merge_base" = "$master_sha" ] && [ "$drop_n" -eq 0 ]; then
              echo "Already up-to-date, skipping"
              ((++skipped))
              echo "::endgroup::"
              continue
            fi

            # Attempt rebase — use interactive rebase to drop orphaned commits
            git checkout "origin/${branch}" --detach

            rebase_ok=0
            if [ "$drop_n" -gt 0 ]; then
              echo "Dropping ${drop_n} orphaned stacking remnant(s)"

              # Build a sed script that changes "pick <sha>" → "drop <sha>" for
              # each orphaned commit. Uses address matching (/^pick SHA/) so it
              # works regardless of git's abbreviated SHA length (core.abbrev).
              : > "${tmpdir}/${i}.sed"
              while read -r sha; do
                echo "/^pick ${sha:0:7}/s/^pick/drop/" >> "${tmpdir}/${i}.sed"
              done < "${tmpdir}/${i}.drop"

              if GIT_SEQUENCE_EDITOR="sed -i -f ${tmpdir}/${i}.sed" git rebase -i origin/master; then
                rebase_ok=1
              fi
            else
              if git rebase origin/master; then
                rebase_ok=1
              fi
            fi

            if [ "$rebase_ok" -ne 1 ]; then
              git rebase --abort || true
              echo "::warning::Rebase conflict on ${branch} (PR #${pr_number}) — skipping"
              ((++failed))
              git checkout --detach origin/master
              echo "::endgroup::"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY RUN — rebase applied cleanly; NOT pushing ${branch} (would drop ${drop_n} orphan(s))"
              ((++would_rebase))
            # The push exit status is HANDLED, not left to abort the step. --force-with-lease
            # legitimately rejects when someone (a human, or update-behind-prs) touched the
            # branch after our fetch — a normal race, not a bug. GitHub's default shell for a
            # `run:` block is `bash -e` (this step sets no `shell:` key), so in the retired
            # version — where the push was a bare command inside an `if` body — that rejection
            # aborted the WHOLE step, abandoning every PR still queued behind it. Putting the
            # push in an `elif` condition exempts it from -e, so one stale lease costs one PR
            # instead of the rest of the run, and the operator still sees it in the summary.
            elif git push origin "HEAD:${branch}" --force-with-lease; then
              echo "✓ Rebased ${branch} onto master (dropped ${drop_n} orphan(s))"
              ((++rebased))
              dropped=$((dropped + drop_n))
            else
              echo "::warning::Force-push REJECTED for ${branch} (PR #${pr_number}) — stale lease: the branch moved since we fetched it. NOT rebased."
              ((++push_failed))
            fi

            git checkout --detach origin/master
            echo "::endgroup::"
          done

          {
            echo "## Rebase Summary"
            if [ "$DRY_RUN" = "true" ]; then
              echo ""
              echo "**DRY RUN — nothing was pushed.**"
              echo ""
              echo "- Would rebase: ${would_rebase}"
              echo "- Orphaned commits that would be dropped: ${orphan_total}"
            else
              echo "- Rebased: ${rebased}"
              echo "- Orphaned commits dropped: ${dropped}"
              echo "- Force-push rejected (stale lease, not rebased): ${push_failed}"
            fi
            echo "- Skipped (stacked on another PR): ${stacked_count}"
            echo "- Skipped (up-to-date): ${skipped}"
            echo "- Conflicts: ${failed}"
          } >> "$GITHUB_STEP_SUMMARY"
