name: Deploy Rehearsal

on:
  pull_request:
    branches: [master]
    paths:
      - 'ibl5/migrations/**.sql'
      - 'ibl5/migrations/**.php'
      - 'ibl5/classes/Boxscore/PhantomBoxscoreRepair.php'
      - 'ibl5/classes/Boxscore/Legacy/**'
      - 'ibl5/bin/rollback-phantom-repair-run'
      - 'ibl5/composer.json'
      - 'ibl5/composer.lock'
      - 'ibl5/bin/migrate'
      - 'ibl5/bin/validate-schema'
      - 'ibl5/config/schema-assertions.php'
      - 'ibl5/classes/Migration/**'
      - '.github/workflows/deploy-rehearsal.yml'
      - '.github/workflows/main.yml'
  push:
    branches: [master]
    paths:
      - 'ibl5/migrations/**.sql'
      - 'ibl5/migrations/**.php'
      - 'ibl5/classes/Boxscore/PhantomBoxscoreRepair.php'
      - 'ibl5/classes/Boxscore/Legacy/**'
      - 'ibl5/bin/rollback-phantom-repair-run'
      - 'ibl5/composer.json'
      - 'ibl5/composer.lock'
      - 'ibl5/bin/migrate'
      - 'ibl5/bin/validate-schema'
      - 'ibl5/config/schema-assertions.php'
      - 'ibl5/classes/Migration/**'
      - '.github/workflows/deploy-rehearsal.yml'
      - '.github/workflows/main.yml'
  workflow_call: {}
  workflow_dispatch:
    inputs:
      simulate_clone_connection_failure:
        description: 'Dry run: fake an ERROR 1203 from the prod dump so the real classifier routes to the cached-dump fallback. Skips no check.'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This job dry-runs pending migrations against a CLONE of production (ADR-0059), so
# content-dependent failures (FK/UNIQUE/NOT-NULL on accumulated rows) surface here
# instead of on the live deploy. Documented blind spot: ibl_box_scores,
# ibl_box_scores_teams, ibl_plr_snapshots, and ibl_plb_snapshots are sampled to the two
# most recent seasons (see bin/rehearsal-prod-dump), so a migration whose failure depends
# ONLY on pre-previous-season rows in those four tables is NOT rehearsed here.
jobs:
  mirror-ready:
    name: Mirror CI images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mirror-ci-images.yml
    with:
      only-missing: true

  rehearse:
    name: Deploy Rehearsal (composer --no-dev + migrate + validate-schema)
    needs: [mirror-ready]
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: iblhoops_ibl5

    services:
      mariadb:
        image: ghcr.io/a-jay85/mirror/mariadb:10.11
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: iblhoops_ibl5
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP environment
        uses: ./.github/actions/setup-php-env
        with:
          cache: 'false'
          create-config: 'false'
          install: 'false'

      # Mirror main.yml "Install PHP dependencies" exactly (--no-dev catches
      # dev-dependency leaks that tests.yml's full install would miss)
      - name: composer install --no-dev (mirrors main.yml)
        working-directory: ibl5
        run: composer install --no-dev --no-interaction --optimize-autoloader

      # config.php requires config.local.php for DB creds; write it from the
      # job-level DB_* env so PHP points at the CI MariaDB service.
      - name: Configure ibl5 to point at CI MariaDB
        working-directory: ibl5
        run: |
          cp config.php.example config.php
          printf '<?php\n$dbhost = %s;\n$dbuname = %s;\n$dbpass = %s;\n$dbname = %s;\n' \
            "'${DB_HOST:-127.0.0.1}'" "'${DB_USER:-root}'" "'${DB_PASS:-root}'" \
            "'${DB_NAME:-ibl5}'" > config.local.php

      # Clone production into the CI MariaDB instead of applying the stale
      # 000_baseline_schema.sql snapshot. The clone carries prod's real schema, real
      # data, AND prod's own `migrations` tracking table, so `bin/migrate` below runs
      # EXACTLY prod's pending set against real rows — a true dry-run of the imminent
      # deploy that surfaces content-dependent failures (FK/UNIQUE/NOT-NULL) on the PR.
      # See ADR-0059. Prod MySQL is not reachable from the runner, so we dump
      # server-side over SSH (the db-backup.yml pattern), reusing the deploy key — no
      # new secrets.
      # Connection-class clone failures fall back to the encrypted cached dump
      # (bin/rehearsal-clone-fallback); see ADR-0224.
      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          require-secrets: 'true'
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Dump filtered production data over SSH (classified on failure)
        id: dump
        env:
          SIMULATE_CONN_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_clone_connection_failure }}
        run: |
          set -uo pipefail
          # Stream the committed, shellcheck-verified dump script to prod via `bash -s`.
          # Server-side socket auth; read-only (mariadb-dump --single-transaction only).
          # Season-sampling tradeoff + blind spot documented in ADR-0059.
          echo "clone_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "cache_day=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          rc=0
          if [ "${SIMULATE_CONN_FAILURE:-false}" = "true" ]; then
            echo "dry run: simulating a connection-class dump failure; the real classifier still decides" >&2
            echo "ERROR 1203 (42000): User rehearsal_dry_run already has more than 'max_user_connections' active connections" > dump-stderr.txt
            : > prod-clone.sql
            rc=1
          else
            ssh -p ${{ secrets.PORT }} -i ~/.ssh/id_deploy \
              ${{ secrets.USERNAME }}@${{ secrets.HOST }} \
              "REMOTE_DATABASE='iblhoops_ibl5' bash -s" < bin/rehearsal-prod-dump \
              > prod-clone.sql 2> dump-stderr.txt || rc=$?
          fi
          cat dump-stderr.txt >&2
          if [ "$rc" -eq 0 ]; then
            echo "source=fresh" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only the REMOTE dump's stderr is classified. A local mysql failure in the
          # load step below never reaches this classifier (ADR-0224).
          if verdict="$(bin/rehearsal-clone-fallback classify dump-stderr.txt)"; then
            echo "$verdict"
            rm -f prod-clone.sql   # discard any partial dump from a mid-dump 2013
            echo "source=fallback-needed" >> "$GITHUB_OUTPUT"
            echo "fallback_code=${verdict#fallback: }" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$verdict"
          echo "::error::prod clone failed (exit $rc) without a connection-class MySQL error; no fallback"
          exit "$rc"

      - name: Restore cached prod dump (connection-class fallback)
        id: restore
        if: steps.dump.outputs.source == 'fallback-needed'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rehearsal-dump-cache
          # Never saved, so it never matches exactly; the prefix takes the newest entry.
          key: rehearsal-prod-dump-v1-${{ steps.dump.outputs.cache_day }}-restore-probe
          restore-keys: rehearsal-prod-dump-v1-

      - name: Decrypt + age-check cached prod dump
        id: fallback
        if: steps.dump.outputs.source == 'fallback-needed'
        env:
          REHEARSAL_KEY_SOURCE: ${{ secrets.PRIVATE_KEY }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          FALLBACK_CODE: ${{ steps.dump.outputs.fallback_code }}
        run: |
          set -euo pipefail
          if [ -z "$MATCHED_KEY" ]; then
            echo "::error::prod clone hit MySQL $FALLBACK_CODE and no cached dump exists; failing as before"
            exit 1
          fi
          if ! age_out="$(bin/rehearsal-clone-fallback check-age rehearsal-dump-cache/meta.txt)"; then
            echo "$age_out"
            echo "::error::cached dump $MATCHED_KEY is older than 7 days or has bad metadata; failing as before"
            exit 1
          fi
          bin/rehearsal-clone-fallback decrypt rehearsal-dump-cache/prod-clone.sql.enc prod-clone.sql.gz
          gunzip -c prod-clone.sql.gz > prod-clone.sql
          rm -f prod-clone.sql.gz
          age_hours="$(sed -n 's/^age_hours=//p' <<< "$age_out")"
          src_url="$(sed -n 's/^source_run_url=//p' <<< "$age_out")"
          src_sha="$(sed -n 's/^source_sha=//p' <<< "$age_out")"
          echo "::warning title=Rehearsal used cached prod dump::Prod clone failed with MySQL $FALLBACK_CODE. Rehearsing against the cached dump cloned ${age_hours}h ago by $src_url (sha $src_sha). Every downstream check still runs."
          {
            echo "### Deploy rehearsal used the cached prod dump"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Clone failure | MySQL $FALLBACK_CODE |"
            echo "| Dump age | ${age_hours}h (limit 168h) |"
            echo "| Source run | $src_url |"
            echo "| Source SHA | $src_sha |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Load prod clone into CI MariaDB
        run: |
          set -euo pipefail
          {
            echo "SET FOREIGN_KEY_CHECKS=0;"
            sed 's/DEFINER=`[^`]*`@`[^`]*`//g' prod-clone.sql
            echo "SET FOREIGN_KEY_CHECKS=1;"
          } | mysql -h 127.0.0.1 -u root -proot iblhoops_ibl5

      - name: Assert clone bounded + migration tracking seeded (false-green guard)
        run: |
          set -euo pipefail
          Q() { mysql -N -B -h 127.0.0.1 -u root -proot iblhoops_ibl5 -e "$1"; }
          # box_scores must be bounded to the recent-season sample AND non-empty —
          # an empty clone would let migrations pass vacuously.
          BS=$(Q "SELECT COUNT(*) FROM ibl_box_scores;")
          echo "Cloned ibl_box_scores rows: $BS"
          if [ "$BS" -lt 1000 ] || [ "$BS" -gt 200000 ]; then
            echo "::error::ibl_box_scores=$BS outside expected sampled bound (1000..200000)"; exit 1
          fi
          # migrations table must carry prod's batch=0 seed, or hasSeededMigrations()
          # returns false and bin/migrate silently skips the entire pending set.
          SEED=$(Q "SELECT COUNT(*) FROM migrations WHERE batch=0;")
          if [ "$SEED" -lt 1 ]; then
            echo "::error::migrations has no batch=0 rows — bin/migrate would skip the pending set"; exit 1
          fi
          # Log the pending set for the run record (may legitimately be empty when a PR
          # touches bin/migrate or composer without adding a migration).
          php ibl5/bin/migrate --status

      # Fallback cache: saved only from a fresh clone that just passed the bound check,
      # never from a fallback restore (that would reset the age clock), never on a PR.
      # On any failure the trap wipes the staging dir, so the upload step below can
      # never cache a plaintext dump.
      - name: Save encrypted prod dump for connection-class fallback
        if: steps.dump.outputs.source == 'fresh' && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          REHEARSAL_KEY_SOURCE: ${{ secrets.PRIVATE_KEY }}
          CLONE_EPOCH: ${{ steps.dump.outputs.clone_epoch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          trap '[ $? -eq 0 ] || rm -rf rehearsal-dump-cache' EXIT
          mkdir -p rehearsal-dump-cache
          gzip -c prod-clone.sql > rehearsal-dump-cache/prod-clone.sql.gz
          bin/rehearsal-clone-fallback encrypt rehearsal-dump-cache/prod-clone.sql.gz rehearsal-dump-cache/prod-clone.sql.enc
          rm -f rehearsal-dump-cache/prod-clone.sql.gz
          bin/rehearsal-clone-fallback write-meta rehearsal-dump-cache/meta.txt "$CLONE_EPOCH" "$RUN_URL" "$GITHUB_SHA"

      - name: Upload encrypted prod dump to the Actions cache
        if: steps.dump.outputs.source == 'fresh' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rehearsal-dump-cache
          key: rehearsal-prod-dump-v1-${{ steps.dump.outputs.cache_day }}

      # Mirror main.yml "Run database migrations" exactly
      - name: php bin/migrate (mirrors main.yml)
        run: php ibl5/bin/migrate

      - name: Assert no migrations remain pending after rehearsal
        run: |
          set -euo pipefail
          OUT=$(php ibl5/bin/migrate --status)
          echo "$OUT"
          echo "$OUT" | grep -q "Nothing to migrate." || { echo "::error::pending migrations remain after rehearsal"; exit 1; }

      - name: Fake revert (apply a paired migration, delete its files, migrate again)
        run: |
          set -euo pipefail
          q() { mysql -h 127.0.0.1 -u root -proot iblhoops_ibl5 -N -B -e "$1"; }
          want() { [ "$2" = "$3" ] || { echo "::error::$1: expected '$3', got '$2'"; exit 1; }; }
          D=ibl5/migrations; P=98_rehearsal_revert_probe
          trap 'rm -f "$D/$P.sql" "$D/$P.down.sql" "$D/99_rehearsal_later.sql"' EXIT
          rows() { q "SELECT COALESCE(GROUP_CONCAT(CONCAT(id, ':', v) ORDER BY id), '') FROM rehearsal_revert_probe"; }
          tracked() { q "SELECT COUNT(*) FROM migrations WHERE migration = '$P.sql'"; }
          write_pair() {
            printf '%s\n' "INSERT IGNORE INTO rehearsal_revert_probe_backup SELECT * FROM rehearsal_revert_probe WHERE v = 'old';" \
              "DELETE FROM rehearsal_revert_probe WHERE v = 'old';" > "$D/$P.sql"
            printf '%s\n' '-- restores: rehearsal_revert_probe' \
              'INSERT IGNORE INTO rehearsal_revert_probe SELECT * FROM rehearsal_revert_probe_backup;' > "$D/$P.down.sql"
          }
          want "down columns exist" "$(q "SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA = DATABASE() AND TABLE_NAME = 'migrations' AND COLUMN_NAME IN ('down_sql', 'up_sha256')")" 2
          q "CREATE TABLE rehearsal_revert_probe (id INT PRIMARY KEY, v VARCHAR(20) NOT NULL) ENGINE=InnoDB;
             CREATE TABLE rehearsal_revert_probe_backup LIKE rehearsal_revert_probe;
             INSERT INTO rehearsal_revert_probe VALUES (1, 'keep'), (2, 'old');"

          # Case 1: a pure revert deploy (no pending files) undoes the data change.
          write_pair; php ibl5/bin/migrate
          want "up deleted the row" "$(rows)" "1:keep"
          want "down SQL stored" "$(q "SELECT COUNT(*) FROM migrations WHERE migration = '$P.sql' AND down_sql IS NOT NULL AND CHAR_LENGTH(up_sha256) = 64")" 1
          rm "$D/$P.sql" "$D/$P.down.sql"
          OUT="$(php ibl5/bin/migrate)"; echo "$OUT"
          grep -qF "Reverted $P.sql" <<< "$OUT" || { echo "::error::revert line missing"; exit 1; }
          grep -qF "Nothing to migrate." <<< "$OUT" || { echo "::error::revert deploy did not reach the no-pending path"; exit 1; }
          want "row restored with its id" "$(rows)" "1:keep,2:old"
          want "tracking row removed" "$(tracked)" 0

          # Case 2: a later migration still exists, so the deploy stops and changes nothing.
          write_pair; echo 'SELECT 1;' > "$D/99_rehearsal_later.sql"; php ibl5/bin/migrate
          rm "$D/$P.sql" "$D/$P.down.sql"
          if OUT="$(php ibl5/bin/migrate)"; then echo "$OUT"; echo "::error::guard did not stop the deploy"; exit 1; fi
          echo "$OUT"
          grep -qF "Cannot auto-revert" <<< "$OUT" || { echo "::error::guard message missing"; exit 1; }
          want "data untouched after refusal" "$(rows)" "1:keep"
          want "tracking row kept after refusal" "$(tracked)" 1
          q "DROP TABLE rehearsal_revert_probe, rehearsal_revert_probe_backup; DELETE FROM migrations WHERE migration IN ('$P.sql', '99_rehearsal_later.sql');"

      # Mirror main.yml "Validate database schema" exactly — this is the gate
      - name: php bin/validate-schema (mirrors main.yml; pre-flight gate)
        run: php ibl5/bin/validate-schema

      # Runs against the untouched prod clone — the smoke fixtures below inject
      # rows, so the assertion has to see the database before they land.
      # ibl_box_scores_teams is sampled to the two most recent seasons here, so
      # this host's claim is "no duplicate in the two most recent seasons at
      # merge time"; the all-seasons guarantee belongs to db-backup.yml.
      - name: Assert no duplicate boxscores in the prod clone
        run: php ibl5/bin/check-boxscore-schedule-run --duplicates-only

      - name: Seed rehearsal database with smoke fixtures
        run: mysql -h 127.0.0.1 -u root -proot iblhoops_ibl5 < ibl5/tests/DatabaseIntegration/Fixtures/db-seed.sql

      - name: Start PHP built-in server for rehearsal smoke probe
        id: server
        run: |
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 20); do
            nc -z 127.0.0.1 8080 && exit 0
            sleep 0.5
          done
          echo "::error::PHP built-in server did not start within 10s"
          cat /tmp/php-server.log
          exit 1

      - name: Run IBL5 smoke checks against rehearsal server
        env:
          SMOKE_REHEARSAL_MODE: "1"
          SMOKE_INTERCHECK_DELAY: "0"
          SMOKE_RETRY_DELAY: "2"
        run: |
          chmod +x bin/smoke-prod
          bin/smoke-prod --scope=ibl5 http://127.0.0.1:8080

      - name: Tear down PHP built-in server
        if: always()
        run: |
          kill ${{ steps.server.outputs.pid }} 2>/dev/null || true
          [ -f /tmp/php-server.log ] && tail -50 /tmp/php-server.log || true
