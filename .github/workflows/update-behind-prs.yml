name: Update BEHIND PRs

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min — ticks are cheap; the debounce below decides which act
  workflow_dispatch:          # manual trigger for on-demand runs + the dispatch smoke test

permissions:
  contents: write        # update-branch writes a merge commit onto the PR head branch
  pull-requests: write   # enumerate PRs and invoke the update-branch endpoint

concurrency:
  group: update-behind-prs
  cancel-in-progress: true

jobs:
  update-behind:
    name: Update open PRs stuck BEHIND master
    runs-on: ubuntu-latest
    steps:
      - name: Update BEHIND PRs
        env:
          GH_TOKEN: ${{ secrets.CI_PAT }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          OWNER="${REPO%/*}"
          NAME="${REPO#*/}"

          # 0. Debounce on master quiet time.
          #
          #    A master merge is what puts every open PR BEHIND, and updating a PR pushes a
          #    merge commit that fans out the full ~11-workflow CI matrix. With the all-open-PRs
          #    scope (#1936) the first tick after any merge therefore updates ~30 PRs at once —
          #    one merge becomes ~300 CI runs, and a merge-heavy afternoon becomes several such
          #    storms. Nothing about that is load-bearing: BEHIND is not urgent, because this
          #    workflow never merges and never arms auto-merge.
          #
          #    So wait until master has been quiet for DEBOUNCE_SECONDS before acting. A burst
          #    of merges coalesces into a single update pass once the burst ends, instead of one
          #    pass per merge. Cost: on a day where master moves more often than the window,
          #    PRs go un-updated until the run rate drops — acceptable, since a stale-but-clean
          #    PR blocks nothing.
          #
          #    workflow_dispatch bypasses the wait, so on-demand unsticking and the dispatch
          #    smoke test still work immediately.
          DEBOUNCE_SECONDS=3600

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch — bypassing the master-quiet debounce."
          else
            master_date=$(gh api "repos/$REPO/commits/master" --jq '.commit.committer.date' || true)

            if [ -z "$master_date" ]; then
              # Fail open: a transient API error must not silently park PR updates forever.
              # Proceeding costs a storm at worst; skipping on every tick would be invisible.
              echo "::warning::Could not read master's last commit date — proceeding without debounce."
            else
              master_epoch=$(date -u -d "$master_date" +%s)
              quiet_for=$(( $(date -u +%s) - master_epoch ))

              if [ "$quiet_for" -lt "$DEBOUNCE_SECONDS" ]; then
                echo "master last moved ${quiet_for}s ago (< ${DEBOUNCE_SECONDS}s) — debouncing."
                {
                  echo "## Update BEHIND PRs"
                  echo "- Skipped: master moved ${quiet_for}s ago, within the ${DEBOUNCE_SECONDS}s debounce window."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi

              echo "master quiet for ${quiet_for}s (>= ${DEBOUNCE_SECONDS}s) — proceeding."
            fi
          fi

          # 1. Enumerate ALL open, non-draft PRs targeting master, with their merge state
          #    and head SHA. Categorization happens in the loop below so the step summary
          #    can report conflict / already-current counts too.
          #
          #    Scope note: this used to select only PRs with auto-merge ARMED, whose job was
          #    narrowly to unstick the merge queue (ADR-0081). It now covers every open
          #    non-draft PR, so long-lived branches stay fresh against master continuously
          #    instead of drifting until someone rebases by hand. Updating a branch is NOT
          #    merging it: this workflow never arms auto-merge and never merges anything, so
          #    the human review bottleneck is unchanged.
          candidates=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -f query='
            query($owner:String!, $name:String!) {
              repository(owner:$owner, name:$name) {
                pullRequests(states:OPEN, baseRefName:"master", first:100) {
                  nodes {
                    number
                    headRefOid
                    mergeable
                    mergeStateStatus
                    isDraft
                  }
                }
              }
            }' --jq '
              .data.repository.pullRequests.nodes[]
              | select(.isDraft | not)
              | "\(.number) \(.headRefOid) \(.mergeStateStatus) \(.mergeable)"')

          updated=0
          skipped_ci=0
          skipped_conflict=0
          already_current=0
          still_unknown=0

          if [ -z "$candidates" ]; then
            echo "No open non-draft PRs targeting master."
          fi

          while IFS=' ' read -r number sha state mergeable; do
            [ -z "$number" ] && continue

            # GitHub computes mergeStateStatus/mergeable LAZILY: the batch query above
            # often returns UNKNOWN while GitHub recomputes in the background, then a
            # later query returns the real value. Re-query this single PR until it
            # resolves, so we don't skip a genuinely-BEHIND PR that merely got caught
            # mid-compute — the defect that left armed PRs (dependabot bumps especially)
            # stuck BEHIND across ticks, because every cold tick re-drew UNKNOWN.
            attempt=0
            while [ "$state" = "UNKNOWN" ] && [ "$attempt" -lt 5 ]; do
              attempt=$((attempt + 1))
              sleep 3
              resolved=$(gh api graphql -f owner="$OWNER" -f name="$NAME" -F number="$number" -f query='
                query($owner:String!, $name:String!, $number:Int!) {
                  repository(owner:$owner, name:$name) {
                    pullRequest(number:$number) {
                      headRefOid
                      mergeStateStatus
                      mergeable
                    }
                  }
                }' --jq '.data.repository.pullRequest | "\(.headRefOid) \(.mergeStateStatus) \(.mergeable)"' || true)
              if [ -n "$resolved" ]; then
                IFS=' ' read -r sha state mergeable <<< "$resolved"
              fi
            done

            echo "::group::PR #$number (state=$state mergeable=$mergeable)"

            # Negative path: a conflicting PR (DIRTY / CONFLICTING) cannot be auto-updated —
            # skip and log; a human must resolve the conflict. Never call update-branch here.
            if [ "$state" = "DIRTY" ] || [ "$mergeable" = "CONFLICTING" ]; then
              echo "Merge conflict — skipping (needs manual resolution)"
              skipped_conflict=$((skipped_conflict + 1))
              echo "::endgroup::"
              continue
            fi

            # Only BEHIND PRs need updating. CLEAN/BLOCKED/UNSTABLE/HAS_HOOKS are not out of
            # date w.r.t. master, so treat as already-current. UNKNOWN here means the poll
            # above exhausted its retries without GitHub settling the state — rare; leave it
            # for the next tick rather than blindly calling update-branch on an unknown state.
            # Poll exhausted without GitHub settling the state — surface it in the summary
            # instead of silently folding into already_current (the skip that hid this bug).
            if [ "$state" = "UNKNOWN" ]; then
              echo "Still UNKNOWN after poll — leaving for next tick"
              still_unknown=$((still_unknown + 1))
              echo "::endgroup::"
              continue
            fi

            if [ "$state" != "BEHIND" ]; then
              echo "Not BEHIND (state=$state) — nothing to update"
              already_current=$((already_current + 1))
              echo "::endgroup::"
              continue
            fi

            # 2. Loop safety (step-level): skip if any check run on the head commit is still
            #    running, so we never re-update the branch while CI from a prior update is live.
            #    REST check-runs statuses are lowercase: queued / in_progress / completed.
            running=$(gh api "repos/$REPO/commits/$sha/check-runs" \
              --jq '[.check_runs[] | select(.status=="in_progress" or .status=="queued")] | length' \
              || echo 0)

            if [ "${running:-0}" -gt 0 ]; then
              echo "CI in progress ($running check run(s) queued/in_progress) — skipping"
              skipped_ci=$((skipped_ci + 1))
              echo "::endgroup::"
              continue
            fi

            # 3. Update the branch via merge commit from master. Authenticated as CI_PAT so the
            #    resulting push triggers CI on the refreshed branch (GITHUB_TOKEN would not).
            if gh api -X PUT "repos/$REPO/pulls/$number/update-branch"; then
              echo "Updated PR #$number onto master"
              updated=$((updated + 1))
            else
              echo "::warning::update-branch failed for PR #$number"
            fi
            echo "::endgroup::"
          done <<< "$candidates"

          # 4. Step summary counts.
          {
            echo "## Update BEHIND PRs"
            echo "- Updated: $updated"
            echo "- Skipped (CI running): $skipped_ci"
            echo "- Skipped (merge conflict): $skipped_conflict"
            echo "- Already current (not BEHIND): $already_current"
            echo "- Still UNKNOWN after poll: $still_unknown"
          } >> "$GITHUB_STEP_SUMMARY"
