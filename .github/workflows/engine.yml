name: Engine

on:
  push:
    branches: [ master, develop ]
    paths:
      - 'engine/**'
      - '.github/workflows/engine.yml'
  pull_request:
    branches: [ master, develop ]
    types: [opened, synchronize, reopened, ready_for_review]
    # Workflow-level filter, same globs as push above. Engine is not a
    # required check (.claude/rules/engine-go.md), so a skipped run blocks
    # nothing. Never copy this into a required workflow; see guard R1 in
    # bin/check-composite-contracts.
    paths:
      - 'engine/**'
      - '.github/workflows/engine.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Go engine CI. bin/website-affecting is not used: it models PHP
  # app-rendering impact. Path scoping lives in the on: triggers above.

  engine:
    name: Go build, vet, lint, test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: engine/go.mod

      - name: Build
        working-directory: engine
        run: go build ./...

      # Fail if any Go file is not gofmt-formatted. Code is currently clean.
      - name: Gofmt check
        working-directory: engine
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: engine
        run: go vet ./...

      # Pinned version = deterministic gate (same philosophy as the go.mod
      # toolchain pin). Bump deliberately; never float to latest.
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: engine

      # Run tests with coverage and enforce a floor. The floor is a ratchet:
      # current total is 95.3%; raise this as coverage improves, never lower it.
      # Kept in sync with COVER_MIN in engine/Makefile.
      - name: Test with coverage floor
        working-directory: engine
        env:
          COVER_MIN: "90.0"
        run: |
          go test -coverprofile=cover.out ./...
          total="$(go tool cover -func=cover.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          echo "total coverage: $total% (floor: $COVER_MIN%)"
          if awk "BEGIN { exit !($total < $COVER_MIN) }"; then
            echo "coverage $total% is below floor $COVER_MIN%"
            exit 1
          fi

  gate:
    name: Engine
    if: always()
    needs: [engine]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
