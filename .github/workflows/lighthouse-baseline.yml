name: Lighthouse Baseline

on:
  push:
    branches: [master]
    paths:
      - '**.php'
      - '**.css'
      - '**.ts'
      - '**.js'
      - 'ibl5/design/**'
      - 'ibl5/migrations/**.sql'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'ibl5/.lighthouserc.json'
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate even if a fresh baseline already exists'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# The baseline audit is ~18 minutes of runner time (56 URLs x ~17s, collected
# serially by lhci), and the paths filter above fires it on nearly every master
# push — roughly twice a day. Neither consumer needs that cadence: the weekly
# audit accepts a baseline up to 7 days old (lighthouse-audit.yml, "Check
# baseline freshness"), and the PR comment (lighthouse.yml) only wants "recent
# master", which is already a moving target between merges. So gate the audit on
# artifact age and skip it when a fresh one exists, returning the runner time to
# a contended pool. FRESH_HOURS is far tighter than either consumer requires, so
# it collapses same-day merge bursts without letting the baseline drift.
# Skipping makes this workflow's newest successful run artifact-less, so both
# consumers set `search_artifacts: true` on their download step to walk back to
# the newest run that actually published the manifest. Removing the gate is safe;
# removing those flags without removing the gate silently drops the baseline.
env:
  FRESH_HOURS: 12

jobs:
  # Fail-open by design: if the artifact API is unreachable, returns nothing, or
  # the latest baseline has expired, `stale` is true and the audit runs. A
  # missing baseline is the expensive failure (lighthouse-audit.yml falls back to
  # a full self-run; the PR comment silently drops its delta column), so every
  # uncertain path must resolve toward regenerating.
  freshness:
    name: Check baseline freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read   # required to list workflow artifacts
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Check age of latest baseline artifact
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "Forced regeneration requested."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CREATED_AT=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?name=lighthouse-baseline-manifest&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .created_at // empty' \
            2>/dev/null || true)

          if [ -z "$CREATED_AT" ]; then
            echo "No unexpired baseline artifact found — regenerating."
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          AGE_HOURS=$(( ($(date -u +%s) - $(date -u -d "$CREATED_AT" +%s)) / 3600 ))
          if [ "$AGE_HOURS" -lt "$FRESH_HOURS" ]; then
            echo "Latest baseline is ${AGE_HOURS}h old (< ${FRESH_HOURS}h) — skipping audit."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            echo "Latest baseline is ${AGE_HOURS}h old (>= ${FRESH_HOURS}h) — regenerating."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  baseline:
    name: Generate baseline
    needs: [freshness]
    if: needs.freshness.outputs.stale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/lighthouse-setup

      - name: Run Lighthouse
        working-directory: ibl5
        run: |
          jq --argjson urls "$(../bin/lighthouse-audit-urls --json --base-url=http://localhost:8080)" \
             '.ci.collect.url = $urls | .ci.collect.numberOfRuns = 1' .lighthouserc.json > /tmp/lhrc.baseline.json
          bunx @lhci/cli collect --config=/tmp/lhrc.baseline.json
        env:
          CHROME_PATH: /usr/bin/google-chrome-stable

      # autorun's upload step uses temporary-public-storage (writes links.json
      # only). The baseline artifact needs manifest.json — emit it via a
      # second filesystem upload from the same collected lhr-*.json files.
      - name: Write manifest.json for baseline artifact
        working-directory: ibl5
        run: |
          bunx @lhci/cli upload --target=filesystem --outputDir=.lighthouseci
          # lhci writes one entry per run (3 per URL); the formatter expects
          # one entry per URL — filter to representative runs.
          jq '[.[] | select(.isRepresentativeRun == true)]' \
            .lighthouseci/manifest.json > .lighthouseci/manifest.tmp.json
          mv .lighthouseci/manifest.tmp.json .lighthouseci/manifest.json

      - name: Upload baseline manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-baseline-manifest
          path: |
            ibl5/.lighthouseci/manifest.json
          retention-days: 30

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes
