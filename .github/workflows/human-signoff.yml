name: Human Sign-off

# Deterministic human-sign-off gate for PRs that change the UI.
#
# Why this exists: the automouse autonomous pipeline (bin/automouse/run → /post-plan
# Phase 6.5) arms `gh pr merge --squash --auto`, and master's branch protection
# requires no reviews — so feature PRs merged unattended overnight (see the
# revert of #1073–#1076). A docs/frontmatter convention (#1072) could not stop
# this: the automouse path never reads it and GitHub has nothing to block on.
#
# This job IS that block. Once added to master's required status checks, a PR
# that changes the UI stays un-mergeable (red required check) until a human
# inspects it and applies the `human-approved` label. `--auto` queues but
# GitHub never completes the merge while a required check is red. The verdict
# never reads the PR title. It comes from bin/lib/ui-change-classifier.sh: a PR
# holds when a changed path is on the UI list, or when its VR gallery shows a
# gating changed or new cell, or when the classifier cannot tell. Every other
# PR passes, so the automouse pipeline can still auto-merge backend and tooling
# work.
#
# The VR gallery arrives late. When no path is on the UI list and VR is
# expected to run, this job waits in-job for the gallery artifact that
# e2e-tests.yml uploads (`vr-gallery-json-<head sha>`), for up to
# UI_VR_ATTEMPTS x UI_VR_SLEEP seconds. Only this PR's own `E2E Tests` run on
# the exact head SHA may supply it, checked through the run API. It stops early
# once every such run finished without one. A timeout holds (`vr-missing`).
# The approving `labeled human-approved` run skips this wait: the label clears
# the hold anyway, and its fingerprint record must land before a sync run's
# HS_AWAIT wait gives up.
#
# After the wait the event payload may be stale. The gate re-reads the live PR
# (ui_live_pr_state) before it judges: it uses the live labels, and when the
# head SHA moved it posts `superseded`, which is red and writes no label,
# record, or drop for the old head. A failed re-read holds.
#
# The classifiers live in bin/lib/human-signoff-classifier.sh and
# bin/lib/ui-change-classifier.sh, sourced by BOTH this workflow and
# bin/test-human-signoff-classifier so the gate's logic cannot drift from its
# regression test. Both jobs load them from the BASE ref, never the PR head.
# That stops a PR from changing the classifier libs; such a change applies
# after merge. It does NOT stop a PR that edits this workflow file itself.
# GitHub runs the PR's own copy of this file on pull_request, so that PR can
# skip the hold. Moving the check to a trusted trigger is on the backlog.
#
# Nothing re-runs this check when the wait times out and the gallery lands
# later. A human re-runs the failed human-signoff job by hand; an automatic
# re-run is tracked in backlog#1798.
#
# The `needs-a-human-label` job mirrors the gate's verdict onto the PR as the
# `needs-a-human` label: added while the gate is red, removed once it passes.
# It is a separate job so only it holds a write token; the gate job stays
# read-only. Labels applied with GITHUB_TOKEN do not start new workflow runs,
# so the label toggle cannot loop back into this workflow.
#
# The human-approved label is pinned to the PR diff (ADR-0062 Update). The gate
# job checks out the PR head and computes the patch-id of origin/<base>...HEAD.
# When the event is the label being applied, the gate passes and the
# human-approved-fingerprint job records that id in a github-actions[bot]
# comment. On every other event for a UI PR holding the label, the gate
# compares the current id with the newest bot record. A mismatch, a missing
# record, or any error reds the gate in the same run (so auto-merge cannot
# complete first), and the write job removes the label and comments why.
#
# No job-level skip. The title-keyed skip of ADR 0210 is gone: the verdict now
# depends on the diff and the VR gallery, which no event payload carries, so a
# skipped run (which GitHub reports as success) could post a passing check on a
# held PR. Each event cancels and replaces the per-PR run. The needs-a-human
# label is written with github.token, so it starts no new run.
#
# Approval race (ADR-0062 Update 2026-11-02): a `labeled` event for
# human-approved runs in its own per-run group (`-approve-<run_id>`), so a push
# seconds later (an update-branch merge) can no longer cancel it before it
# records the fingerprint. A run that would drop `missing`, or `mismatch`
# against a stale older record (ADR-0062 Update 2026-11-08), while that label
# event is at or after the newest bot marker re-reads comments for up to
# HS_AWAIT_ATTEMPTS x HS_AWAIT_SLEEP seconds, and only a matching bot record
# keeps the label. The write job skips a record that a newer approval or a
# newer revoke supersedes.

on:
  pull_request:
    branches: [ master ]
    # labeled/unlabeled re-run the gate so applying `human-approved` flips red→green.
    # Every event runs the job; none may skip.
    types: [opened, reopened, synchronize, edited, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: ${{ (github.event.action == 'labeled' && github.event.label.name == 'human-approved') && format('human-signoff-{0}-approve-{1}', github.event.pull_request.number, github.run_id) || format('human-signoff-{0}', github.event.pull_request.number) }}
  cancel-in-progress: true

jobs:
  human-signoff:
    name: human-signoff
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      verdict: ${{ steps.eval.outputs.verdict }}
      reason: ${{ steps.eval.outputs.reason }}
      fingerprint: ${{ steps.eval.outputs.fingerprint }}
      comment_body: ${{ steps.eval.outputs.comment_body }}
      approved_at: ${{ steps.eval.outputs.approved_at }}
    steps:
      # Check out the PR HEAD (not the default refs/pull/N/merge), shallow. The
      # eval step deepens history only for a UI PR holding the label, so the
      # fingerprint is the PR's own diff against its merge base.
      # The head tree is data only. ui_dev_patch_exempt parses its ibl5/package.json and ibl5/bun.lock with jq and diff.
      - name: Checkout the PR head (diff fingerprint only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      # The gate logic comes from the BASE ref, never the PR head. That stops
      # a PR from changing the classifier, bin/website-affecting, or a helper
      # they call; such an edit takes effect after merge. A PR that edits this
      # workflow file itself can still skip the hold, because GitHub runs the
      # PR's copy of this file on pull_request.
      # This checkout runs second because a root checkout cleans the workspace.
      - name: Checkout the base ref (trusted classifier lib)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .hs-base
          fetch-depth: 1
          persist-credentials: false
      - name: Evaluate human sign-off and the approved-diff fingerprint
        id: eval
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Bounded wait for an in-flight approving run's record (ADR-0062 Update 2026-11-02).
          HS_AWAIT_ATTEMPTS: '20'
          HS_AWAIT_SLEEP: '15'
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # Bounded wait for this PR's own head-SHA VR gallery artifact (e2e-tests.yml).
          UI_VR_ATTEMPTS: '90'
          UI_VR_SLEEP: '30'
        run: |
          set -euo pipefail
          HS_LIB="$GITHUB_WORKSPACE/.hs-base/bin/lib"
          # A base without the UI classifier cannot judge the PR, so it holds.
          if [ ! -f "$HS_LIB/ui-change-classifier.sh" ] || [ ! -f "$HS_LIB/human-signoff-classifier.sh" ]; then
            echo "::error title=Human sign-off required::The base ref has no bin/lib/ui-change-classifier.sh, so the gate cannot judge this PR. A maintainer must inspect it."
            echo "verdict=hold" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck source=bin/lib/human-signoff-classifier.sh
          source "$HS_LIB/human-signoff-classifier.sh"
          # shellcheck source=bin/lib/ui-change-classifier.sh
          source "$HS_LIB/ui-change-classifier.sh"
          PATHS="$RUNNER_TEMP/ui-paths.txt"
          if ! gh api --paginate "repos/$GH_REPO/pulls/$PR/files" \
               --jq '.[] | .filename, (.previous_filename // empty)' > "$PATHS"; then
            : > "$PATHS"   # empty list -> ui-unknown -> hold
          fi
          if [ "$(wc -l < "$PATHS")" -ge 3000 ]; then : > "$PATHS"; fi  # API cap: cannot tell
          # ui_dev_patch_exempt reads ibl5/package.json and ibl5/bun.lock from
          # both checkouts: the trusted base at .hs-base and the PR head at the root.
          # ui_composer_exempt reads ibl5/composer.json and ibl5/composer.lock the same way.
          export UI_BASE_DIR="$GITHUB_WORKSPACE/.hs-base" UI_HEAD_DIR="$GITHUB_WORKSPACE"
          # The memo-hit gallery fallback reads the E2E memo coverage list from the
          # base ref, never from PR-head code. A missing list has no include
          # patterns, so the fallback refuses and the PR holds.
          cp "$GITHUB_WORKSPACE/.hs-base/.github/ci-memo/e2e.paths" "$RUNNER_TEMP/base-e2e.paths" 2>/dev/null \
            || : > "$RUNNER_TEMP/base-e2e.paths"
          export UI_MEMO_PATHS_FILE="$RUNNER_TEMP/base-e2e.paths"
          # The approving label run skips the gallery wait so its record lands
          # before a sync run's bounded HS_AWAIT wait gives up.
          UI_VERDICT=$(ui_workflow_verdict "$PATHS" "$PR_AUTHOR" ui_fetch_gallery_gh "$ACTION" "$EVENT_LABEL") || true
          UI_VERDICT="${UI_VERDICT:-ui-unknown}"
          echo "UI verdict: $UI_VERDICT"

          # The gallery wait can run for many minutes, so the payload's LABELS
          # and HEAD_SHA may be stale by now. Re-read the live PR once. A moved
          # head posts no verdict for the old head (superseded is red and
          # writes nothing). A failed read holds with no labels.
          LIVE_RC=0
          LIVE_LABELS=$(ui_live_pr_state "$HEAD_SHA" ui_fetch_pr_gh) || LIVE_RC=$?
          case "$LIVE_RC" in
            0) LABELS="$LIVE_LABELS" ;;
            3)
              echo "Head moved off $HEAD_SHA during the wait; no verdict for the old head"
              echo "verdict=superseded" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            *)
              echo "::warning::could not re-read the live PR; holding with no labels"
              UI_VERDICT=ui-unknown
              LABELS="" ;;
          esac

          # Every failure below leaves FP or COMMENTS empty/absent, and
          # hs_eval_approval turns that into a drop for a PR holding the label
          # (red for a UI PR, green for a non-UI PR).
          # Any PR holding human-approved reads FP and COMMENTS. An unlabeled
          # non-UI PR skips the deep fetch, the diff, and the comment read.
          FP=""
          COMMENTS="$RUNNER_TEMP/hs-comments.json"
          if hs_pr_cleared "$UI_VERDICT" "$LABELS" && { [ "$UI_VERDICT" != not-ui ] || hs_has_approval_label "$LABELS"; }; then
            if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
              git fetch --no-tags --quiet --unshallow origin || echo "::warning::could not deepen history"
            fi
            if ! git fetch --no-tags --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"; then
              echo "::warning::could not fetch origin/$BASE_REF"
            fi
            if FP=$(hs_diff_fingerprint "origin/$BASE_REF" "$HEAD_SHA"); then
              echo "Diff fingerprint: $FP (origin/$BASE_REF...$HEAD_SHA)"
            else
              FP=""
              echo "Diff fingerprint: unavailable (origin/$BASE_REF...$HEAD_SHA)"
            fi

            if ! { gh api --paginate --slurp "repos/$GH_REPO/issues/$PR/comments" > "$RUNNER_TEMP/hs-pages.json" \
                   && jq 'add // []' "$RUNNER_TEMP/hs-pages.json" > "$COMMENTS"; }; then
              rm -f "$COMMENTS"
              echo "Comment read failed; a UI PR holding the label will fail closed"
            fi
          fi

          hs_eval_approval "$ACTION" "$EVENT_LABEL" "$UI_VERDICT" "$LABELS" "$FP" "$COMMENTS" || true

          # A push seconds after the label (an update-branch merge) can read
          # comments before the approving run posts its record. When the newest
          # human-approved label event is at or after the newest bot marker,
          # re-read comments for a bounded time. Only a matching bot record
          # keeps the label; an events read error drops `error`.
          # A mismatch against a stale older record waits the same way (ADR-0062 Update 2026-11-08).
          if [ "$HS_VERDICT" = "drop" ] && { [ "$HS_DROP_REASON" = "missing" ] || [ "$HS_DROP_REASON" = "mismatch" ]; }; then
            EVENTS="$RUNNER_TEMP/hs-events.json"
            if ! { gh api --paginate --slurp "repos/$GH_REPO/issues/$PR/events" > "$RUNNER_TEMP/hs-event-pages.json" \
                   && jq 'add // []' "$RUNNER_TEMP/hs-event-pages.json" > "$EVENTS"; }; then
              rm -f "$EVENTS"
              echo "Issue events read failed; the would-be missing or mismatch drop becomes error"
            fi
            hs_refetch_comments() {
              gh api --paginate --slurp "repos/$GH_REPO/issues/$PR/comments" > "$RUNNER_TEMP/hs-pages.json" \
                && jq 'add // []' "$RUNNER_TEMP/hs-pages.json" > "$1"
            }
            hs_await_record "$HS_AWAIT_ATTEMPTS" "$HS_AWAIT_SLEEP" hs_refetch_comments \
              "$ACTION" "$EVENT_LABEL" "$UI_VERDICT" "$LABELS" "$FP" "$COMMENTS" "$EVENTS" || true
          fi

          # The approving run records its own label event time, so the write
          # job can skip a record that a newer approval or revoke supersedes.
          APPROVED_AT=""
          if [ "$HS_VERDICT" = "record" ]; then
            if { gh api --paginate --slurp "repos/$GH_REPO/issues/$PR/events" > "$RUNNER_TEMP/hs-event-pages.json" \
                 && jq 'add // []' "$RUNNER_TEMP/hs-event-pages.json" > "$RUNNER_TEMP/hs-events.json"; } \
               && APPROVED_AT=$(hs_newest_label_at "$RUNNER_TEMP/hs-events.json"); then
              echo "Approving label event: $APPROVED_AT"
            else
              APPROVED_AT=""
              echo "::warning::could not read the approving label event; the write job will skip the record (fail closed)"
            fi
          fi

          BODY=""
          case "$HS_VERDICT" in
            record) BODY=$(hs_record_comment_body "$FP" "$HEAD_SHA") ;;
            drop) BODY=$(hs_drop_comment_body "$HS_DROP_REASON" "$HEAD_SHA") ;;
          esac
          delim="HS_BODY_$(openssl rand -hex 12)"
          {
            echo "verdict=$HS_VERDICT"
            echo "gate_red=${HS_GATE_RED:-}"
            echo "reason=$HS_DROP_REASON"
            echo "fingerprint=$FP"
            echo "approved_at=$APPROVED_AT"
            echo "comment_body<<$delim"
            printf '%s\n' "$BODY"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
      # A separate step maps the verdict to the check result, so the outputs
      # above are always published for the write job. An unset or unknown
      # verdict (the eval step crashed) is red.
      - name: Require human sign-off for UI PRs
        env:
          VERDICT: ${{ steps.eval.outputs.verdict }}
          GATE_RED: ${{ steps.eval.outputs.gate_red }}
        run: |
          set -euo pipefail
          # A drop on a non-UI PR stays green: the write job still removes the
          # label and posts the revoke, so post-plan condition (7) holds again.
          case "$VERDICT" in
            pass|keep|record) echo "Human sign-off gate: $VERDICT" ;;
            drop)
              if [ "${GATE_RED:-}" = 0 ]; then
                echo "Human sign-off gate: drop on a non-UI PR (green; approval removed)"
                exit 0
              fi
              echo "Human sign-off gate: drop (red)"; exit 1 ;;
            *) echo "Human sign-off gate: ${VERDICT:-unset} (red)"; exit 1 ;;
          esac

  needs-a-human-label:
    name: needs-a-human label
    needs: human-signoff
    # always() so a red gate still runs this job. A cancelled gate was
    # superseded by a newer run, which owns the label instead.
    if: always() && (needs.human-signoff.result == 'failure' || needs.human-signoff.result == 'success')
    runs-on: ubuntu-26.04
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Sync the needs-a-human label with the gate result
        # The label is advisory. A label API error must never add a red check
        # that bin/lib/pr-armable.sh condition (15) would read as a CI failure.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ needs.human-signoff.result }}
          VERDICT: ${{ needs.human-signoff.outputs.verdict }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'needs-a-human') }}
        run: |
          set -euo pipefail
          # The head moved during the gate's wait. The newer head's run owns the label.
          if [ "$VERDICT" = "superseded" ]; then
            echo "Gate superseded by a newer head; label left alone"
            exit 0
          fi
          if [ "$RESULT" = "failure" ]; then
            # Create the label on first use; a no-op once it exists.
            gh label create needs-a-human --color D93F0B \
              --description "Blocked on the human-signoff check; a maintainer must inspect it and apply human-approved" \
              2>/dev/null || true
            gh api --method POST "repos/$GH_REPO/issues/$PR/labels" -f 'labels[]=needs-a-human' >/dev/null
          elif [ "$HAS_LABEL" = "true" ]; then
            gh api --method DELETE "repos/$GH_REPO/issues/$PR/labels/needs-a-human" >/dev/null
          fi

  human-approved-fingerprint:
    name: human-approved fingerprint
    needs: human-signoff
    # Runs only when the gate asked for a write: record on approval, or drop.
    # A cancelled gate was superseded by a newer run, which owns the write.
    # !cancelled() so a cancelled run skips this job even if its gate finished.
    if: ${{ !cancelled() && (needs.human-signoff.result == 'failure' || needs.human-signoff.result == 'success') && (needs.human-signoff.outputs.verdict == 'record' || needs.human-signoff.outputs.verdict == 'drop') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Only the record branch reads the lib. A failed checkout makes the
      # record guard skip; the drop branch never depends on it. The lib comes
      # from the BASE ref: this job holds a write token.
      - name: Checkout the base ref (trusted classifier lib)
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record or revoke the approved diff fingerprint
        # A failed write never adds a red check (pr-armable.sh condition 15).
        # A failed record leaves no fingerprint, so the next push drops the
        # label (fail closed). A failed drop leaves the gate red, and the
        # revoked marker posted first makes the next run drop again.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          VERDICT: ${{ needs.human-signoff.outputs.verdict }}
          BODY: ${{ needs.human-signoff.outputs.comment_body }}
          APPROVED_AT: ${{ needs.human-signoff.outputs.approved_at }}
        run: |
          set -euo pipefail
          if [ -z "$BODY" ]; then
            echo "::warning::empty comment body for verdict $VERDICT; nothing written"
            exit 1
          fi
          if [ "$VERDICT" = "record" ]; then
            WOK=0
            LABELS_NOW=""
            # shellcheck source=bin/lib/human-signoff-classifier.sh
            if ! source bin/lib/human-signoff-classifier.sh; then WOK=2; fi
            if [ "$WOK" = 0 ] && ! { gh api --paginate --slurp "repos/$GH_REPO/issues/$PR/events" > "$RUNNER_TEMP/w-ev-pages.json" \
                && jq 'add // []' "$RUNNER_TEMP/w-ev-pages.json" > "$RUNNER_TEMP/w-ev.json" \
                && gh api --paginate --slurp "repos/$GH_REPO/issues/$PR/comments" > "$RUNNER_TEMP/w-cm-pages.json" \
                && jq 'add // []' "$RUNNER_TEMP/w-cm-pages.json" > "$RUNNER_TEMP/w-cm.json" \
                && gh api --paginate --slurp "repos/$GH_REPO/issues/$PR/labels" > "$RUNNER_TEMP/w-lb-pages.json" \
                && LABELS_NOW=$(jq -r 'add // [] | map(.name) | join(",")' "$RUNNER_TEMP/w-lb-pages.json"); }; then
              WOK=2
            fi
            if [ "$WOK" = 0 ]; then
              hs_record_write_ok "$APPROVED_AT" "$LABELS_NOW" "$RUNNER_TEMP/w-ev.json" "$RUNNER_TEMP/w-cm.json" || WOK=$?
            fi
            case "$WOK" in
              0) ;;
              1) echo "Record skipped: a newer approval, a newer revoke, or a removed label owns the PR state"; exit 0 ;;
              *) echo "::warning::record guard could not read PR state; record skipped (fail closed)"; exit 1 ;;
            esac
          fi
          gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          if [ "$VERDICT" = "drop" ]; then
            gh api --method DELETE "repos/$GH_REPO/issues/$PR/labels/human-approved" >/dev/null
          fi
