name: 'Setup SSH deploy key'
description: >-
  Write the deploy private key to ~/.ssh/id_deploy (chmod 600) and keyscan the
  host into ~/.ssh/known_hosts. Optionally fail loud when any required secret is
  empty (for workflow_call callers that may forget `secrets: inherit`).
inputs:
  host:
    description: 'SSH host to keyscan (and assert non-empty when require-secrets is true).'
    required: true
  port:
    description: 'SSH port.'
    required: true
  private-key:
    description: 'SSH private key (secrets.PRIVATE_KEY). Written to ~/.ssh/id_deploy.'
    required: true
  username:
    description: 'SSH username — only asserted non-empty when require-secrets is true.'
    required: false
    default: ''
  require-secrets:
    description: >-
      When "true", fail loud if PORT/HOST/USERNAME/PRIVATE_KEY are empty.
    required: false
    default: 'false'
  fail-on-unreachable:
    description: >-
      When "true", fail this step if every keyscan try comes back empty. When
      "false", only print an error annotation and pass, so a caller whose next
      step reports the outage (for example a failure alert) still runs.
    required: false
    default: 'false'
outputs:
  blocked-ip:
    description: >-
      This runner's public IP when every keyscan try came back empty, else
      empty. Give it to the host so they can find the firewall block.
    value: ${{ steps.keyscan.outputs.blocked-ip }}
runs:
  using: 'composite'
  steps:
    - name: Write deploy key and keyscan host
      id: keyscan
      shell: bash
      env:
        PORT: ${{ inputs.port }}
        HOST: ${{ inputs.host }}
        USERNAME: ${{ inputs.username }}
        DEPLOY_KEY: ${{ inputs.private-key }}
        REQUIRE_SECRETS: ${{ inputs.require-secrets }}
        FAIL_ON_UNREACHABLE: ${{ inputs.fail-on-unreachable }}
      run: |
        set -euo pipefail
        if [ "$REQUIRE_SECRETS" = "true" ]; then
          # Fail loud if a secret is empty. When the workflow runs via `workflow_call`
          # the caller MUST pass `secrets: inherit`, or these render empty and `ssh -p`
          # silently consumes `-i` as its port arg ("Bad port '-i'"). See run 27378437919.
          : "${PORT:?empty — caller must pass 'secrets: inherit'}"
          : "${HOST:?empty — caller must pass 'secrets: inherit'}"
          : "${USERNAME:?empty — caller must pass 'secrets: inherit'}"
          : "${DEPLOY_KEY:?empty — caller must pass 'secrets: inherit'}"
        fi
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/id_deploy
        chmod 600 ~/.ssh/id_deploy
        # Ride out short network blips on the host. ConnectionAttempts retries
        # only the TCP connect, before any remote command runs, so a retry can
        # never run a deploy command twice. 6 x 30s covers a ~3 min outage only
        # when the host is silent (each try waits out ConnectTimeout). A fast
        # "Connection refused" burns all 6 tries in about 6s.
        # Run 44396293952 failed on one 2 min connect timeout.
        cat >> ~/.ssh/config <<'EOF'
        Host *
          ConnectTimeout 30
          ConnectionAttempts 6
        EOF
        chmod 600 ~/.ssh/config
        # Retry the keyscan too: an empty known_hosts makes every later ssh fail.
        # ssh-keyscan exits 0 even when it gets no keys, so check its output.
        START=$SECONDS
        KEYS=''
        for _ in 1 2 3 4 5 6; do
          KEYS=$(ssh-keyscan -T 30 -p "$PORT" "$HOST" 2>/dev/null || true)
          if [ -n "$KEYS" ]; then
            printf '%s\n' "$KEYS" >> ~/.ssh/known_hosts
            break
          fi
          sleep 10
        done
        ELAPSED=$((SECONDS - START))
        # Without this check an empty scan passed silently, and the next ssh call
        # failed later with a confusing "Host key verification failed".
        # Run 44411988785 hit that after the host blocked one runner for ~7 min.
        if [ -z "$KEYS" ]; then
          # Record this runner's public IP. The host's firewall log is the only
          # place that shows why one runner was shut out, and they need the IP
          # to search it (3 blocked runners on 2026-11-18, each ~7 min).
          RUNNER_IP=$(curl -fsS --max-time 10 https://api.ipify.org 2>/dev/null || true)
          case "$RUNNER_IP" in
            *[!0-9a-fA-F.:]*|'') RUNNER_IP=unknown ;;
          esac
          echo "blocked-ip=${RUNNER_IP}" >> "$GITHUB_OUTPUT"
          echo "Prod SSH unreachable from runner IP ${RUNNER_IP} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Prod SSH unreachable::ssh-keyscan got no host keys after 6 tries over ${ELAPSED}s. This runner (public IP ${RUNNER_IP}) could not reach the SSH host. Other runners may still reach it, so a rerun (new runner, new IP) often passes."
          if [ "$FAIL_ON_UNREACHABLE" = "true" ]; then
            exit 1
          fi
        fi
