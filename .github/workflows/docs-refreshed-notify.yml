name: Docs Refreshed Notify

# Fires only on explicit dispatch from bin/docfix-poll on the Mac.
# Recursion is impossible: nothing in CI dispatches this workflow.
#
# Load-bearing deployment note: GitHub only dispatches a workflow whose
# workflow_dispatch trigger already exists on the default branch. The first
# real dispatch is therefore only possible after this PR merges onto master.
#
# The head-ref guard (docs-stale-refresh- prefix) has moved into
# bin/lib/docfix-dm.sh where it is exercisable by the test harness.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number of the docs-stale-refresh-* PR to notify about
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read      # `gh pr view --json files` for the refreshed file list

concurrency:
  group: docs-refreshed-notify-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  notify-refreshed:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Discord message
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PR_NUMBER travels via env, never interpolated inline — prevents shell injection.
          source bin/lib/docfix-dm.sh
          docfix_dm_compose "$PR_NUMBER" /tmp/discord-msg.txt

      - name: Setup SSH
        uses: ./.github/actions/setup-ssh
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Send Discord DM
        uses: ./.github/actions/notify-discord
        with:
          discord-id: ${{ secrets.OWNER_DISCORD_ID }}
          port: ${{ secrets.PORT }}
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
