name: Tests and Analysis

on:
  push:
    branches: [ master, develop ]
    paths:
      - '**.php'
      - 'ibl5/migrations/**.sql'
      - 'bin/**'
      - 'ibl5/bin/**'
      # IBLbot (Discord bot + bug-bot HTTP server) has no other CI host — without
      # this line an IBLbot-only push to master never triggers this workflow, so
      # the iblbot job would gate PRs but not master. Every `changes` output is
      # blanket-true on push, so such a push also fans out to the PHP jobs;
      # that is pre-existing sibling behaviour (`bin/**` does the same), not new.
      - 'ibl5/IBLbot/**'
      # audit-js has no other CI host either, and a dependency bump lands on
      # master as a manifest/lockfile-only commit — so without these lines the
      # merge of such a commit never triggers this workflow and master's JS audit
      # simply never runs. Verified on d0d87473d (#1853, a three-lockfile merge):
      # `gh run list --commit d0d87473d` returned nothing. Same blanket-true
      # fan-out caveat as the sibling entries above applies.
      - 'ibl5/package.json'
      - 'ibl5/bun.lock'
  pull_request:
    branches: [ master, develop ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pull-requests: read
    outputs:
      src: ${{ github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]' || steps.filter.outputs.src == 'true' }}
      shell: ${{ github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]' || steps.filter.outputs.shell == 'true' }}
      ibl5ts: ${{ github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]' || steps.filter.outputs.ibl5ts == 'true' }}
      iblbot: ${{ github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]' || steps.filter.outputs.iblbot == 'true' }}
      jsdeps: ${{ github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]' || steps.filter.outputs.jsdeps == 'true' }}
      workflows: ${{ github.event_name == 'push' || github.event.pull_request.user.login == 'dependabot[bot]' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            src:
              - '**.php'
              - 'ibl5/migrations/**.sql'
              - 'ibl5/composer.json'
              - 'ibl5/composer.lock'
              - 'ibl5/phpunit.xml'
              - 'ibl5/phpstan.neon'
              - 'ibl5/phpstan-tests.neon'
              - 'ibl5/phpstan-tests-baseline.neon'
              - 'ibl5/phpstan-rules/**'
              - 'ibl5/tests/DatabaseIntegration/Fixtures/**'
              - '.github/workflows/tests.yml'
            shell:
              - 'bin/**'
              - 'ibl5/bin/**'
              - '.github/workflows/tests.yml'
              # bin/test-postplan-arm-conditions reads the Phase 6.5 condition
              # blocks AND the Phase 2.5 backlog trigger block from these two
              # files, so an edit to either alone must run the harness job.
              - '.claude/skills/post-plan/SKILL.md'
              - '.claude/skills/post-plan/_phase-6.5-arm-auto-merge.md'
              # bin/test-post-review-findings reads the Step 7 / Step 1 blocks here,
              # so a skill-only edit must run the harness job too.
              - '.claude/skills/pr-review/SKILL.md'
              - '.claude/skills/security-audit/SKILL.md'
              # bin/test-check-plan and bin/test-postplan-arm-conditions read the
              # gate definitions and the Phase 5.0 conformance blocks from these
              # three files, so a skill-only edit must run the harness job too.
              - '.claude/skills/plan/SKILL.md'
              - '.claude/review-shared/_plan-verification.md'
              - '.claude/skills/post-plan/_phase-5-final-verification.md'
              # bin/test-human-signoff-classifier guards the classifier lib that
              # human-signoff.yml sources, so a workflow-only edit must run it too.
              - '.github/workflows/human-signoff.yml'
              # /pr-ready's runtime blocks are committed scripts, and bin/test-pr-ready-now
              # case 16 asserts on SKILL.md, so both must trigger shellcheck + harness-tests.
              - '.claude/skills/pr-ready/**'
              # Agent defs are asserted by bin/test-pr-ready-now's static case (the /pr-ready
              # Phase 6 reviewer def), so an agent-def-only PR must run harness-tests too.
              - '.claude/agents/**'
            ibl5ts:
              # Everything the ibl5 TS unit suite executes or imports
              # (tests/ts-unit/ specs cover the pure VR-review helpers and
              # the E2E summarizer script — see ibl5/vitest.unit.config.ts).
              - 'ibl5/tests/ts-unit/**'
              - 'ibl5/tests/e2e/vr-*.ts'
              - '.github/scripts/summarize-e2e-results.mjs'
              - 'ibl5/vitest.unit.config.ts'
              - 'ibl5/package.json'
              - 'ibl5/bun.lock'
              - '.github/workflows/tests.yml'

            iblbot:
              # IBLbot has its own npm package + tsconfig + vitest suite
              # (src/bug-bot/*.test.ts). Whole-directory glob: every source file
              # is either compiled by tsc or exercised by the suite.
              - 'ibl5/IBLbot/**'
              - '.github/workflows/tests.yml'

            jsdeps:
              # Everything audit-js reads. It was gated on `src` alone, which
              # lists no JS manifest — so a dependency-only PR SKIPPED the audit
              # entirely. That is how #1850 ("npm audit fix") merged green while
              # leaving the extract-zip chain unfixed: the gate never ran on it,
              # and only unrelated PHP PRs afterwards showed the red X.
              # audit-js runs `bun install --frozen-lockfile` + `bun audit`, so
              # package.json + bun.lock are its literal inputs — and they are now
              # the ONLY dependency manifests for ibl5 (package-lock.json is gone;
              # ADR-0101). Deliberately its OWN output rather than added to `src`:
              # `src` also gates PHPUnit, PHPStan and Database Integration Tests,
              # which a lockfile-only PR has no reason to run.
              - 'ibl5/package.json'
              - 'ibl5/bun.lock'
              - '.github/workflows/tests.yml'

            workflows:
              # Everything actionlint reads. .github/actions/** is NOT optional
              # here: actionlint validates each caller's `with:` keys against the
              # called composite's action.yml, so "changed setup-php-env's inputs,
              # broke a caller" is a composite-only diff that must still run it.
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'bin/lint-workflows'

  test:
    name: PHPUnit Tests
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        php-version: ['8.5']

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP environment
      uses: ./.github/actions/setup-php-env
      with:
        php-version: ${{ matrix.php-version }}
        extensions: mbstring, intl, pcov
        coverage: pcov

    - name: Run PHPUnit tests with coverage
      working-directory: ibl5
      run: |
        mkdir -p coverage
        echo "::group::Full PHPUnit output"
        set +eo pipefail
        vendor/bin/phpunit \
          --testdox \
          --coverage-clover coverage/clover.xml \
          --colors=always 2>&1 | tee /tmp/phpunit-output.txt
        PHPUNIT_EXIT=${PIPESTATUS[0]}
        set -eo pipefail
        echo "::endgroup::"

        if [ $PHPUNIT_EXIT -ne 0 ]; then
          echo ""
          echo "════════════════════════════════════════"
          echo "  FAILURE SUMMARY"
          echo "════════════════════════════════════════"
          sed 's/\x1b\[[0-9;]*m//g' /tmp/phpunit-output.txt | awk '/✔/{show=0} /✘/{show=1} show' || true
          echo ""
          sed 's/\x1b\[[0-9;]*m//g' /tmp/phpunit-output.txt | awk '/^FAILURES!$/,0' || true
          echo "════════════════════════════════════════"
        fi
        exit $PHPUNIT_EXIT

    - name: Check coverage threshold
      working-directory: ibl5
      run: php bin/check-coverage coverage/clover.xml 80

    - name: Check coverage regression
      working-directory: ibl5
      run: php bin/check-coverage-regression coverage/clover.xml coverage-baseline.json

    - name: Check if threshold needs ratcheting
      working-directory: ibl5
      run: |
        THRESHOLD=80
        BUFFER=5
        COVERAGE=$(php -r '
          $xml = simplexml_load_file("coverage/clover.xml");
          $m = $xml->xpath("/coverage/project/metrics")[0];
          echo round((int)$m["coveredstatements"] / (int)$m["statements"] * 100, 2);
        ')
        GAP=$(echo "$COVERAGE - $THRESHOLD" | bc)
        if (( $(echo "$GAP > $BUFFER" | bc -l) )); then
          NEW_THRESHOLD=$(echo "$COVERAGE - 2" | bc | cut -d. -f1)
          echo "::warning::Coverage is ${COVERAGE}%, threshold is ${THRESHOLD}%. Consider ratcheting to ${NEW_THRESHOLD}% in .github/workflows/tests.yml"
        fi

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report
        path: ibl5/coverage/
        retention-days: 7

  audit-php:
    name: PHP Dependency Audit
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP environment
      uses: ./.github/actions/setup-php-env
      with:
        extensions: ''
        create-config: 'false'

    - name: Audit PHP dependencies
      working-directory: ibl5
      run: composer audit

  audit-js:
    name: JS Dependency Audit (bun)
    needs: [changes]
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.jsdeps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    # Drift gate. Runs BEFORE the plain install so a package.json bumped without
    # a regenerated bun.lock fails here with a precise message rather than being
    # silently papered over by a lockfile-updating install. Exits 1 with
    # "lockfile had changes, but lockfile is frozen".
    - name: Verify lockfile is up-to-date (frozen-lockfile drift gate)
      working-directory: ibl5
      run: bun install --frozen-lockfile

    - name: Audit JS dependencies (bun)
      working-directory: ibl5
      run: bun audit --audit-level=high

  ibl5-ts-unit:
    name: IBL5 TS Unit Tests
    needs: [changes]
    if: needs.changes.outputs.ibl5ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

    - name: Install dependencies
      working-directory: ibl5
      run: bun install

    # Pure-unit vitest config (tests/ts-unit/, no DB/browser/env) — the fast
    # suite locking the VR-review helper and E2E-summarizer contracts.
    - name: TS unit tests (vitest)
      working-directory: ibl5
      run: bun run test:unit

  iblbot:
    name: IBLbot Type Check & Unit Tests
    needs: [changes]
    if: needs.changes.outputs.iblbot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ibl5/IBLbot/package-lock.json

    - name: Install dependencies
      working-directory: ibl5/IBLbot
      run: npm ci

    # main.yml compiles IBLbot with tsc on the PROD host during deploy, so a type
    # error there breaks a live deploy with no earlier backstop. Catch it here.
    - name: Type check (tsc)
      working-directory: ibl5/IBLbot
      run: npx tsc --noEmit

    # Pure-unit vitest suite (src/bug-bot/*.test.ts — no DB, no network). The
    # opt-in live smoke is describe.runIf(BUG_BOT_LIVE) so it stays skipped here.
    - name: Unit tests (vitest)
      working-directory: ibl5/IBLbot
      run: npm test

  db-integration:
    name: Database Integration Tests
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ibl5
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup PHP environment
      uses: ./.github/actions/setup-php-env

    - name: Apply migrations
      working-directory: ibl5
      run: bin/run-migrations-ci -h 127.0.0.1 -u root -proot ibl5

    - name: Import seed data
      working-directory: ibl5
      run: mysql -h 127.0.0.1 -u root -proot ibl5 < tests/DatabaseIntegration/Fixtures/db-seed.sql

    - name: Run database integration tests
      working-directory: ibl5
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASS: root
        DB_NAME: ibl5
      run: vendor/bin/phpunit --group database --no-progress --testdox-summary

  phpstan:
    name: PHPStan Analysis
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # create-config defaults to 'true': scripts/ require_once __DIR__ . '/../config.php',
    # which is gitignored. Without it PHPStan reports requireOnce.fileNotFound for every
    # such script — errors a developer never sees locally, and which the master
    # update-baselines job (create-config default 'true') never bakes into the baseline.
    - name: Setup PHP environment
      uses: ./.github/actions/setup-php-env

    # Key prefix bumped to v2 to evict caches written before config.php existed in this
    # job. PHPStan's result cache does not invalidate a requireOnce.fileNotFound entry
    # when the missing file later appears, so a restored v1 cache replays stale errors.
    - name: Cache PHPStan result cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ibl5/tmp
          ibl5/tmp-tests
        key: phpstan-v2-${{ hashFiles('ibl5/phpstan.neon', 'ibl5/phpstan-tests.neon', 'ibl5/phpstan-rules/**') }}
        restore-keys: |
          phpstan-v2-

    - name: Run PHPStan
      working-directory: ibl5
      run: composer run analyse

    - name: Run PHPStan (tests)
      working-directory: ibl5
      run: composer run analyse:tests

    - name: Check baseline drift
      working-directory: ibl5
      run: php bin/check-baseline-drift

  phpunit-hygiene:
    name: PHPUnit hygiene gate
    needs: [changes]
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Ban silently-disabled tests (markTestSkipped)
        run: bin/check-phpunit-hygiene --pr

  shellcheck:
    name: ShellCheck (bash 3.2 compat)
    needs: [changes]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on bin/** and skill scripts
        run: |
          set -e
          # Find shell scripts: files with .sh extension OR bash/sh shebang
          mapfile -t scripts < <(
            {
              find bin ibl5/bin .claude/skills/pr-ready/scripts -type f -name '*.sh' 2>/dev/null || true
              find bin ibl5/bin .claude/skills/pr-ready/scripts -type f -not -name '*.sh' 2>/dev/null \
                | while read -r f; do
                    head -c 40 "$f" 2>/dev/null | grep -qE '^#!(/usr)?/bin/(ba)?sh' && echo "$f"
                  done
            } | sort -u
          )

          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to check."
            exit 0
          fi

          echo "Checking ${#scripts[@]} shell scripts with --severity=warning..."
          printf '  %s\n' "${scripts[@]}"
          echo ""

          # --severity=warning catches SC3044 (declare -A unsupported in bash 3.2)
          # and other portability issues. -s bash targets bash specifically; scripts
          # must work in bash 3.2 (macOS default shell).
          #
          # Excludes for pre-existing warnings, tracked as burn-down debt:
          #   SC2034 — unused variables (bin/lib/wt-guards.sh)
          #   SC1090 — non-const source (db-sync-prod, log-fetch-prod
          #            source dynamic .env file)
          #   SC2207 — array splitting suggestion (ibl5/bin/run-migrations-ci:20,
          #            CI-only script, suggestion uses bash 4 mapfile)
          # Bash portability checks (SC3xxx) remain fully enforced.
          shellcheck --severity=warning --shell=bash \
            --exclude=SC2034,SC1090,SC2207 \
            "${scripts[@]}"

  pinact-check:
    name: Action SHA-pin drift guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinact
        run: go install github.com/suzuki-shunsuke/pinact/v3/cmd/pinact@v3.10.1

      - name: Verify every external action is SHA-pinned
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$(go env GOPATH)/bin/pinact" run --check'

  actionlint:
    name: Workflow lint (actionlint)
    needs: [changes]
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Explicit setup-go rather than the runner's preinstalled toolchain:
      # actionlint v1.7.12's go.mod requires go >= 1.25.0, and `go install`
      # hard-fails when the toolchain is older. The sibling pinact-check job
      # rides the preinstalled Go only because its pin needs less.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      # Version-pinned, not @latest: a new upstream rule would otherwise land as
      # a red X on an unrelated PR that touched no workflow logic. Bump
      # deliberately, with the resulting findings in the same commit.
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      # Installed explicitly, exactly as the sibling ShellCheck job does — this
      # repo does not assume the runner image ships it. actionlint's run:-block
      # pass is half this gate; bin/lint-workflows hard-fails without it rather
      # than letting actionlint skip the pass and still exit 0.
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # No working-directory — the script lives in repo-root bin/ and cds to the
      # repo root itself. Shell policy (severity + excludes) lives in the script
      # so a local run and this job cannot drift.
      - name: Lint workflows
        run: bin/lint-workflows

  host-mariadb-guard:
    name: Host mariadb grep guard
    needs: [changes]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Grep for host mariadb invocations outside bin/db-query
        run: |
          set -e
          # Worktrees run a separate dockerized MariaDB per worktree. Calling the host
          # `mariadb` client with -h 127.0.0.1 bypasses worktree isolation and will read
          # or mutate the wrong database. Only bin/db-query is allowed to do this, and
          # only on one branch: it routes by its own script location, so the host client
          # runs solely for the main checkout's copy (or under DB_QUERY_TARGET=main).
          # A worktree's copy goes through `docker exec ibl5-db-<slug>` and fails loudly
          # if that container is not running. On ERROR 1049 it also names the $dbname it
          # used and where that name came from. See .claude/rules/database-access.md.
          offenders=$(
            grep -rEn '^[[:space:]]*mariadb[[:space:]]+(-h[[:space:]]*127|-u[[:space:]]*root)' \
              bin/ ibl5/bin/ 2>/dev/null \
              | grep -v -E '(bin/db-query|\.md|tests\.yml)' \
              || true
          )

          if [ -n "$offenders" ]; then
            echo "FAIL: direct host mariadb invocations found in shell scripts."
            echo ""
            echo "$offenders"
            echo ""
            echo "Worktrees have isolated dockerized MariaDB instances. Use bin/db-query"
            echo "or 'docker exec <container> mariadb ...' instead of calling the host client."
            exit 1
          fi

          echo "OK: no host mariadb invocations found outside bin/db-query."

  automouse-impl-model-test:
    name: Automouse impl-model parser test
    needs: [changes]
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run automouse impl-model parser regression test
        run: bin/test-automouse-impl-model
      - name: Run automouse env-breaker regression test
        run: bin/test-automouse-env-breaker
      - name: Run automouse impl cap-timeout regression test
        run: bin/test-automouse-impl-cap-timeout

  update-baselines:
    name: Update coverage & PHPStan baselines
    needs: [test, phpstan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.CI_PAT }}

    - name: Setup PHP environment
      uses: ./.github/actions/setup-php-env
      with:
        extensions: mbstring, intl

    - name: Download coverage report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: coverage-report
        path: ibl5/coverage/

    - name: Update coverage baseline
      working-directory: ibl5
      run: |
        COVERAGE=$(php -r '
          $xml = simplexml_load_file("coverage/clover.xml");
          $m = $xml->xpath("/coverage/project/metrics")[0];
          echo round((int)$m["coveredstatements"] / (int)$m["statements"] * 100, 2);
        ')
        TOLERANCE=$(php -r '
          $json = file_get_contents("coverage-baseline.json");
          $data = json_decode($json, true);
          echo $data["tolerance"] ?? "0.5";
        ')
        php -r '
          echo json_encode([
              "percentage" => (float) $argv[1],
              "tolerance" => (float) $argv[2],
          ], JSON_PRETTY_PRINT) . "\n";
        ' "$COVERAGE" "$TOLERANCE" > coverage-baseline.json

    - name: Update PHPStan baseline counts
      working-directory: ibl5
      run: php bin/check-baseline-drift --update

    - name: Commit updated baselines
      working-directory: ibl5
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add coverage-baseline.json phpstan-baseline-counts.json
        if git diff --cached --quiet; then
          echo "No baseline changes detected"
        else
          git commit -m "ci: update coverage & PHPStan baseline snapshots [auto]"
          git pull --rebase origin master
          git push
        fi

  regen-codebase-map:
    name: Regenerate codebase-map
    # Master-push only, mirroring `regen-schema-dump` in migration-safety.yml.
    # Replaces the old PR-side `git diff --exit-code` check, which measured the
    # PR's map against master-merged classes/ and so fired on base drift rather
    # than on real signal. Regenerating on master instead makes the map
    # self-healing: whatever squash-merge landed, master converges within one
    # push. `bin/generate-codebase-map` normalizes the date before comparing, so
    # a bot commit only happens when module content actually changed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ secrets.CI_PAT }}

    - name: Regenerate codebase map
      run: bin/generate-codebase-map

    - name: Commit regenerated map if changed
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .claude/rules/codebase-map.md
        if git diff --cached --quiet; then
          echo "No codebase-map changes"
        else
          git commit -m "ci: regenerate codebase-map [auto]"
          git pull --rebase origin master
          git push
        fi

  static-guards:
    name: Static guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Folds three unconditional micro-guards into one sequential job to save runner
    # startup overhead (mirrors the PR #1269 meta-checks fold). NO `if:` and NO
    # `needs:` — every check below runs unconditionally because none is covered by a
    # path-filter, so gating on `src`/`shell` would skip exactly when the bug lands.
    # Each check is a few seconds of grep/bash with no dependencies.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # infection-excludes: a stale exclude can be introduced by editing
      # ibl5/infection.json5 alone, which no path-filter covers.
      - name: Check infection.json5 file excludes resolve
        working-directory: ibl5
        run: bin/check-infection-excludes
      # csrf-field-name: a wrong CSRF field name (name="csrf_token" without the
      # leading underscore) silently rejects every form submission and is invisible
      # to PHPStan/tests.
      - name: Check CSRF form field names
        working-directory: ibl5
        run: bin/check-csrf-field-name
      # seed-id-uniqueness: seed fixtures load with ON DUPLICATE KEY UPDATE, so a
      # reused pid/teamid silently clobbers an earlier row instead of failing
      # (PR #1024). Also catches hand-picked duplicate migration numbers.
      - name: Check seed ids and migration numbers are unique
        working-directory: ibl5
        run: bin/check-seed-id-uniqueness
      # config-example: CI copies config.php.example verbatim to config.php, so an
      # empty/zero placeholder becomes the CI test environment (PR #1008).
      - name: Check config.php.example placeholders
        working-directory: ibl5
        run: bin/check-config-example
      # th-aria-label: aria-label on <th> silently fails axe empty-table-header;
      # the correct fix is a sr-only span inside the th (PR postmortem, a11y audit).
      - name: Check th aria-label usage
        working-directory: ibl5
        run: bin/check-th-aria-label
      # xml-class-refs: phpunit XML configs silently ignore missing suite directories,
      # so a renamed/moved test directory leaves a stale ref with no error.
      - name: Check phpunit XML file/directory references
        working-directory: ibl5
        run: php bin/check-xml-class-refs
      # phpstan-bin-coverage: extension-less PHP scripts in bin/ dodge PHPStan's
      # directory scan. This guard ensures every new one is explicitly listed.
      - name: Check PHP bin scripts covered by PHPStan
        working-directory: ibl5
        run: bin/check-phpstan-bin-coverage
      # workflow-lint: a job that `uses:` a local ./.github/actions/* action without
      # a prior checkout fails only at runtime, and a composite that drops a pinned
      # behavior contract fails silently. NOTE: NO working-directory — these scripts
      # live in repo-root bin/ and scan repo-root .github/.
      - name: Local-action checkout ordering
        run: bin/check-workflow-checkout
      - name: Composite behavior contracts
        run: bin/check-composite-contracts
      # rules-byte-budget: a path-unscoped .claude/rules/*.md file (always loaded
      # into every session's context) can grow past its token budget via an edit
      # that no src/shell path-filter covers. bin/check-rules-byte-budget (NEW,
      # Phase 1) caps it. Backlog: token-spend-backlog T2.
      - name: Check path-unscoped rules byte budget
        run: bin/check-rules-byte-budget
      # claude-dir-placement: a worktree's cwd is <worktree>/ibl5, so a skill or
      # agent def authored relative to cwd lands at ibl5/.claude/... — one level
      # too deep. The harness discovers neither, so the file merges CI-green and
      # the skill is simply never available (PR #1831 shipped /pr-attack dead).
      - name: Check skill/agent defs live in repo-root .claude
        run: bin/check-claude-dir-placement
      # shallow-fetch guard: a shallow fetch inside repo tooling is safe on a CI
      # runner but silently CREATES .git/shallow in a full local clone, grafting
      # origin/<base> to one commit. merge-base then returns nothing and the next
      # rebase replays the whole history and conflicts — and because every worktree
      # shares the main checkout's .git, one local run breaks the ship pipeline
      # repo-wide (that is exactly how check-rules-byte-budget:86 failed a
      # post-plan run). Shallow flags must sit behind an is-shallow-repository
      # guard and carry a `# shallow-ok` marker on the line.
      - name: Check shallow git fetches are guarded
        run: |
          set +e
          # NO \b — git grep -E is POSIX ERE and silently matches NOTHING on \b,
          # which would make this gate fail open. Verified against origin/master.
          raw=$(git grep -nE 'git[^#]*(fetch|pull)[^#]*--(depth|shallow-since|shallow-exclude)' \
                  -- bin .claude tools ibl5/bin)
          rc=$?
          set -e
          # rc 0 = matches, 1 = none; anything higher means git grep itself failed
          # (e.g. a pathspec that stopped existing) — fail closed, never green.
          [ "$rc" -le 1 ] || { echo "FAIL: git grep errored (rc=$rc) — gate cannot verify" >&2; exit 1; }
          hits=$(printf '%s' "$raw" | grep -v '# shallow-ok' || true)
          if [ -n "$hits" ]; then
            echo "FAIL: unguarded shallow git fetch (corrupts a full local clone's .git):" >&2
            echo "$hits" >&2
            echo "Guard it, then mark the line: if [ \"\$(git rev-parse --is-shallow-repository)\" = true ]; then git fetch --depth=1 ...  # shallow-ok" >&2
            exit 1
          fi
          echo "OK: no unguarded shallow git fetch"

