name: Lighthouse CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || steps.filter.outputs.src == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Change-detection strategy: bin/website-affecting (domain gate), NOT a
      # static glob. Lighthouse audits rendered app pages, so the trigger must be
      # "does this diff affect app rendering?" — the same domain question e2e-tests
      # asks, sharing the one gate (bin/website-affecting) so the two workflows
      # stay in lockstep. A static glob would drift out of sync with it.
      - name: Compute website-affecting
        id: filter
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$CHANGED" | bin/website-affecting; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi

  # Content-hash memo (ADR-0131 addendum). Same input set as the e2e memo
  # (--manifest reuses .github/ci-memo/e2e.paths) under its own `lighthouse`
  # scope, so the key never collides with the e2e key. bin/ci-memo folds the
  # php-apache image digest for this scope too; an unreadable manifest yields
  # empty hash= and key= so neither lookup nor save fires. PR-only: re-runs and
  # non-PR events bypass it. The audit is not a required context, so a skip
  # weakens no merge gate.
  ci-memo-check:
    name: Lighthouse Memo Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      hash: ${{ steps.key.outputs.hash }}
      key: ${{ steps.key.outputs.key }}
      hit: ${{ steps.lookup.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Authenticate to GHCR
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Compute memo key
        id: key
        env:
          CI_MEMO_BYPASS: ${{ (github.event_name != 'pull_request' || github.run_attempt != '1') && 'not_pr_or_rerun' || '' }}
        run: bin/ci-memo key lighthouse --manifest .github/ci-memo/e2e.paths
      - name: Look up memo
        id: lookup
        if: steps.key.outputs.hash != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-memo-sentinel
          key: ${{ steps.key.outputs.key }}
      - name: Report memo result
        env:
          MEMO_HASH: ${{ steps.key.outputs.hash }}
          MEMO_RESULT: ${{ steps.lookup.outputs.cache-hit == 'true' && 'hit' || 'miss' }}
        run: bin/ci-memo report lighthouse "$MEMO_HASH" "$MEMO_RESULT" .ci-memo-sentinel

  lighthouse:
    name: Performance Audit
    needs: [changes, ci-memo-check]
    if: always() && needs.changes.outputs.src == 'true' && needs.ci-memo-check.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Written only at the end of this job, after the audit step succeeded, on a
    # run that was a miss. Empty hash (bypass or unreadable manifest) => no save.
    env:
      MEMO_WRITE: ${{ needs.ci-memo-check.outputs.hash != '' && needs.ci-memo-check.outputs.hit != 'true' }}

    steps:
      # fetch-depth: 0 is load-bearing — the URL-selection step below diffs
      # against the PR base SHA, whose history a shallow checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/lighthouse-setup

      # --- Lighthouse ---
      - name: Run Lighthouse CI
        id: lhci
        working-directory: ibl5
        run: |
          # Feed the changed-path list in explicitly rather than letting the
          # script resolve origin/master itself: actions/checkout on a
          # pull_request fetches refs/pull/N/merge, so refs/remotes/origin/*
          # never exists here. Same base ref the `changes` job diffs against.
          CHANGED=$(git -C "$GITHUB_WORKSPACE" diff --name-only \
            "$BASE_SHA"...HEAD)
          if [ -n "$CHANGED" ]; then
            URLS=$(printf '%s\n' "$CHANGED" \
              | ../bin/lighthouse-pr-urls --stdin --json --base-url=http://localhost:8080)
            jq --argjson urls "$URLS" \
               '.ci.collect.url = $urls' .lighthouserc.json > /tmp/lhrc.pr.json
          else
            cp .lighthouserc.json /tmp/lhrc.pr.json
          fi
          bunx @lhci/cli autorun --config=/tmp/lhrc.pr.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome-stable
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # autorun's upload step uses temporary-public-storage (writes links.json
      # only). The comment formatter also needs manifest.json — emit it via a
      # second filesystem upload from the same collected lhr-*.json files.
      - name: Write manifest.json for comment formatter
        working-directory: ibl5
        run: |
          bunx @lhci/cli upload --target=filesystem --outputDir=.lighthouseci
          # lhci writes one entry per run (3 per URL); the formatter expects
          # one entry per URL — filter to representative runs.
          jq '[.[] | select(.isRepresentativeRun == true)]' \
            .lighthouseci/manifest.json > .lighthouseci/manifest.tmp.json
          mv .lighthouseci/manifest.tmp.json .lighthouseci/manifest.json

      - name: Download master baseline
        id: baseline
        if: always()
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        continue-on-error: true
        with:
          workflow: lighthouse-baseline.yml
          branch: master
          name: lighthouse-baseline-manifest
          path: ibl5/baseline/
          if_no_artifact_found: warn
          # The baseline workflow now skips its expensive job when a fresh baseline
          # already exists (lighthouse-baseline.yml, FRESH_HOURS), so its newest
          # successful run often carries no artifact. Without this, the action would
          # pick that run and find nothing; search_artifacts walks back to the newest
          # run that actually published the manifest.
          search_artifacts: true

      - name: Generate PR comment
        id: comment
        if: always()
        working-directory: ibl5
        run: |
          BASELINE_FLAG=""
          if [[ -f baseline/manifest.json ]]; then
            BASELINE_FLAG="--baseline=baseline/manifest.json"
          fi
          ../bin/lighthouse-comment \
            --manifest=.lighthouseci/manifest.json \
            --links=.lighthouseci/links.json \
            $BASELINE_FLAG \
            --out=.lighthouseci/comment.md || true

      - name: Post sticky PR comment
        if: always() && github.event_name == 'pull_request' && hashFiles('ibl5/.lighthouseci/comment.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: lighthouse-comment
          path: ibl5/.lighthouseci/comment.md

      # --- CI memo (ADR-0131 addendum) ---
      # A step `if:` with no status function gets success() ANDed in, so a
      # failure in any earlier step, and the audit step in particular, skips
      # both memo steps. A failed run never saves a memo.
      - name: Write memo sentinel
        if: steps.lhci.conclusion == 'success' && env.MEMO_WRITE == 'true'
        env:
          MEMO_HASH: ${{ needs.ci-memo-check.outputs.hash }}
        run: bin/ci-memo record lighthouse "$MEMO_HASH" .ci-memo-sentinel
      - name: Save CI memo
        if: steps.lhci.conclusion == 'success' && env.MEMO_WRITE == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-memo-sentinel
          key: ${{ needs.ci-memo-check.outputs.key }}

      # --- Cleanup ---
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes
