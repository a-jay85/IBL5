name: Mirror CI images

# Copies the Docker Hub images CI uses (.github/ci-image-mirror.txt) to
# ghcr.io/a-jay85/mirror/<name>:<tag>. Called with only-missing by each consumer
# workflow's mirror-ready job, so a missing or deleted mirror self-heals before
# any job pulls it. The weekly and master-push runs re-copy every ref.
on:
  workflow_call:
    inputs:
      only-missing:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      only-missing:
        type: boolean
        default: false
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [master]
    paths:
      - '.github/ci-image-mirror.txt'
      - '.github/workflows/mirror-ci-images.yml'
      - 'bin/ci-image-mirror'

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror CI images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Mirror images
        env:
          ONLY_MISSING: ${{ inputs.only-missing }}
        run: |
          if [ "$ONLY_MISSING" = "true" ]; then
            bin/ci-image-mirror --only-missing
          else
            bin/ci-image-mirror
          fi
