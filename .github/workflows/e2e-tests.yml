          fi
          echo "$HOME/.cml/node_modules/.bin" >> $GITHUB_PATH

      - name: Generate E2E report with screenshots
        if: always() && github.event_name == 'pull_request'
        working-directory: ibl5
        run: |
          node ../.github/scripts/summarize-e2e-results.mjs \
            --visual=visual-results/test-results.json \
            --visual-screenshots=visual-results/test-results/ \
            --functional=test-results.json \
            --functional-screenshots=shard-test-results/ \
            --artifact-url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /tmp/e2e-comment.md

      - name: Post E2E results to PR
        if: always() && github.event_name == 'pull_request'
        working-directory: ibl5
        env:
          REPO_TOKEN: ${{ github.token }}
        run: cml comment update --target=pr --publish /tmp/e2e-comment.md

  gate:
    name: E2E Tests
    if: always()
    needs: [changes, e2e, api-e2e, e2e-shards, e2e-mutators]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')

  # Retention/cleanup for the per-SHA visual-review reports on gh-pages. Runs on
  # pushes to master (not on PRs, so it is NOT part of the `gate` required check)
  # and prunes per-SHA dirs twice: a 14-day age prune (by newest commit date),
  # then a count cap keeping only the 300 most recent survivors. At the measured
  # ~76 dirs/day arrival rate the cap is the binding bound; both run so the tree is
  # bounded by age AND by size.
  vr-pages-cleanup:
    name: VR Pages retention cleanup
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout gh-pages (skip if it does not exist yet)
        id: checkout-pages
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Prune per-SHA report dirs (14-day age prune + 300-dir count cap)
        id: prune
        if: steps.checkout-pages.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A fresh checkout resets filesystem mtimes, so `find -mtime` is unreliable;
          # derive each per-SHA dir's age from its newest commit date instead.
          cutoff=$(( $(date +%s) - 14 * 86400 ))
          removed=0
          while IFS= read -r d; do
            ts=$(git log -1 --format=%ct -- "$d")
            if [ -n "$ts" ] && [ "$ts" -lt "$cutoff" ]; then
              git rm -rq "$d" && removed=$((removed + 1))
            fi
          done < <(find . -mindepth 1 -maxdepth 1 -type d -not -name '.git')
          # --- Pass 2: count cap over the age prune's survivors ------------------
          # `git rm -r` above already removed each pruned dir from the working tree,
          # so this second `find` enumerates survivors only.
          # N=300. Measured 2026-08-30 on a scratch clone of gh-pages: 1072 per-SHA
          # dirs, ~76 dirs/day gross arrival, and an age histogram terminating hard
          # at day 14 — i.e. the age prune above is verified WORKING, not a no-op.
          # So 300 is ~4 days of retention: a deliberate cut from the 14-day window,
          # taken to bound the Pages upload. Re-measure before changing this number.
          N=300
          ranked=$(mktemp)
          while IFS= read -r d; do
            ts=$(git log -1 --format=%ct -- "$d")
            # No commit (untracked/stray dir): rank it as "now" so it survives — the
            # age pass above deliberately spares that class too, via its `-n` guard.
            printf '%s\t%s\n' "${ts:-$(date +%s)}" "$d" >> "$ranked"
          done < <(find . -mindepth 1 -maxdepth 1 -type d -not -name '.git')
          # Newest first, dir name as a deterministic tiebreak. `tail -n +$((N + 1))`
          # emits nothing when survivors <= N, so the exactly-at-N boundary is a
          # natural no-op. Process substitution (never a pipe) so the `removed`
          # increments below run in THIS shell rather than a discarded subshell.
          while IFS= read -r d; do
            git rm -rq "$d" && removed=$((removed + 1))
          done < <(sort -k1,1nr -k2,2 "$ranked" | tail -n +$((N + 1)) | cut -f2-)
          rm -f "$ranked"
          if [ "$removed" -gt 0 ]; then
            git commit -m "chore(vr-pages): prune ${removed} per-SHA report dir(s) (14d age + 300-dir cap)"
            # Same shared-ref contention as the per-SHA deploy above: in-flight PR VR
            # jobs push their own <sha>/ dirs to gh-pages while we prune. Those commits
            # add paths we never touch, so a rejected push is always contention and a
            # rebase-then-retry resolves it.
            for attempt in 1 2 3; do
              if git push origin gh-pages; then
                echo "pruned=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "gh-pages push rejected (attempt ${attempt}/3) — rebasing onto the updated ref."
              git pull --rebase origin gh-pages
            done
            echo "::error::gh-pages prune push failed after 3 attempts."
            exit 1
          else
            echo "Nothing to prune."
          fi

      # A prune only reaches the SERVED site when pages-deploy.yml re-publishes the tree. Under the
      # old workflow_run trigger the master E2E completion did that implicitly; now it is explicit.
      - name: Re-serve the gh-pages tree (dispatch Pages deploy)
        if: steps.prune.outputs.pruned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Debounce the push fan-out: one master push can trigger multiple open-PR CI runs, so N PRs each
          # land a gh-pages push and each dispatches this workflow. A pages-deploy run that has NOT
          # STARTED yet checks out gh-pages *after* this push landed, so it already serves this
          # content — a second dispatch only adds a run that the `pages` concurrency group cancels
          # (one pending slot per group). NEVER debounce on `in_progress`: that run may have checked
          # out gh-pages before this push and would leave it unserved. Fails OPEN — an extra deploy
          # is harmless, a missed one leaves the gallery dark.
          #
          # The filter is a DENYLIST (not `status == "queued"`) on purpose. GitHub has shipped several
          # pre-execution statuses (queued/pending/waiting/requested) and a concurrency-blocked run has
          # used more than one of them (observed 2026-08-18: two back-to-back dispatches cycled through
          # `waiting`, `queued` AND `pending` across two polls a minute apart); an allowlist that
          # misses the current spelling makes this a silent no-op that nothing would ever surface.
          # Over-suppressing costs one push a wait for the next deploy — and since every deploy
          # re-serves the WHOLE tree, that self-heals on the next PR. Under-suppressing just breaks
          # the debounce, invisibly.
          queued=$(gh api "repos/${{ github.repository }}/actions/workflows/pages-deploy.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed" and .status != "in_progress")] | length' 2>/dev/null || echo "")
          if [[ "$queued" =~ ^[0-9]+$ ]] && [ "$queued" -gt 0 ]; then
            echo "${queued} pages-deploy run(s) already queued — one will publish this push. Skipping dispatch."
            exit 0
          fi

          gh workflow run pages-deploy.yml --ref "${{ github.event.repository.default_branch }}"
