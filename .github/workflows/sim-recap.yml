name: Sim recap
on:
  repository_dispatch:
    types: [sim-recap]
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'   # future-time trigger; an idle run exits at the empty-tick cost guard
  workflow_dispatch:
    inputs:
      sim: { description: 'Claim this sim (digits) instead of claim-next', required: false, default: '' }
  pull_request:
    paths: ['.github/workflows/sim-recap.yml']   # checkout and parse only; Check secrets is skipped
permissions:
  contents: read
  actions: write               # lets the re-dispatch step start workflow_dispatch
concurrency:
  group: sim-recap
  cancel-in-progress: false
jobs:
  recap:
    runs-on: ubuntu-latest
    timeout-minutes: 40          # SIM_RECAP_CLAUDE_TIMEOUT 1800s + setup
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check secrets
        id: secrets
        if: github.event_name != 'pull_request'
        env:
          T1: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          T2: ${{ secrets.SIM_RECAP_SSH_KEY }}
          T3: ${{ secrets.SIM_RECAP_REMOTE_ROOT }}
          T4: ${{ secrets.SIM_RECAP_DB_USER }}
          T5: ${{ secrets.SIM_RECAP_DB_NAME }}
          T6: ${{ secrets.SIM_RECAP_DB_PASSWORD }}
          T7: ${{ secrets.HOST }}
          T8: ${{ secrets.PORT }}
          T9: ${{ secrets.USERNAME }}
        run: |
          if [ -z "$T1$T2$T3$T4$T5$T6$T7$T8$T9" ] \
             || [ -z "$T1" ] || [ -z "$T2" ] || [ -z "$T3" ] || [ -z "$T4" ] \
             || [ -z "$T5" ] || [ -z "$T6" ] || [ -z "$T7" ] || [ -z "$T8" ] || [ -z "$T9" ]; then
            echo "secrets not configured, skipping"
            missing=""
            for pair in CLAUDE_CODE_OAUTH_TOKEN:T1 SIM_RECAP_SSH_KEY:T2 SIM_RECAP_REMOTE_ROOT:T3 SIM_RECAP_DB_USER:T4 SIM_RECAP_DB_NAME:T5 SIM_RECAP_DB_PASSWORD:T6 HOST:T7 PORT:T8 USERNAME:T9; do
              [ -n "${!pair#*:}" ] || missing="${missing:+$missing, }${pair%%:*}"
            done
            echo "::warning title=sim-recap::secrets missing: ${missing}; GitHub cannot run recaps. The Mac backup claims pending sims after 45 minutes."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install mysql client, jq, claude CLI
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client jq >/dev/null
          # Download to a file so a failed fetch (e.g. HTTP 429) fails the step instead of piping nothing into bash.
          curl --retry 4 --retry-all-errors --retry-delay 10 -fsSL \
            -o "$RUNNER_TEMP/claude-install.sh" https://claude.ai/install.sh
          bash "$RUNNER_TEMP/claude-install.sh" >/dev/null
          export PATH="$HOME/.local/bin:$PATH"
          command -v claude >/dev/null || { echo "::error title=sim-recap::claude CLI not found on PATH after install"; exit 1; }
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: SSH key and ControlMaster config
        if: steps.secrets.outputs.configured == 'true'
        uses: ./.github/actions/setup-ssh
        with: { host: '${{ secrets.HOST }}', port: '${{ secrets.PORT }}', private-key: '${{ secrets.SIM_RECAP_SSH_KEY }}' }
      - name: Write ssh config
        if: steps.secrets.outputs.configured == 'true'
        env: { H: '${{ secrets.HOST }}', P: '${{ secrets.PORT }}', U: '${{ secrets.USERNAME }}' }
        run: |
          mkdir -p ~/.ssh/cm && printf 'Host ibl-prod\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  ControlMaster auto\n  ControlPath ~/.ssh/cm/%%C\n  ControlPersist 10m\n  ServerAliveInterval 30\n' "$H" "$P" "$U" >> ~/.ssh/config
      - name: Restore ops-alert edge state
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: '${{ runner.temp }}/sim-recap-state', key: 'sim-recap-ops-alert-${{ github.run_id }}', restore-keys: 'sim-recap-ops-alert-' }
      - name: Run tick
        id: tick
        if: steps.secrets.outputs.configured == 'true'
        timeout-minutes: 35
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SIM_RECAP_HOST_MODE: actions
          SIM_RECAP_SSH_HOST: ibl-prod
          SIM_RECAP_REMOTE_ROOT: ${{ secrets.SIM_RECAP_REMOTE_ROOT }}
          SIM_RECAP_DB_USER: ${{ secrets.SIM_RECAP_DB_USER }}
          SIM_RECAP_DB_NAME: ${{ secrets.SIM_RECAP_DB_NAME }}
          SIM_RECAP_DB_PASSWORD: ${{ secrets.SIM_RECAP_DB_PASSWORD }}
          SIM_RECAP_MYSQL_BIN: /usr/bin/mysql
          SIM_RECAP_OPS_WEBHOOK_URL: ${{ secrets.SIM_RECAP_OPS_WEBHOOK_URL }}
          SIM_RECAP_OPS_ALERT_THREAD_ID: ${{ secrets.SIM_RECAP_OPS_ALERT_THREAD_ID }}
          SIM_RECAP_OPS_ALERT_STATE: ${{ runner.temp }}/sim-recap-state/ops-alert.json
          SIM_INPUT: ${{ github.event.inputs.sim }}
          DISPATCH_SIM: ${{ github.event.client_payload.sim }}
        run: |
          mkdir -p "$(dirname "$SIM_RECAP_OPS_ALERT_STATE")" && touch "$(dirname "$SIM_RECAP_OPS_ALERT_STATE")/.keep"
          [ -n "$DISPATCH_SIM" ] && echo "dispatched for sim $DISPATCH_SIM (claim-next drains the queue)"
          sim_arg=""
          if [ -n "$SIM_INPUT" ]; then
            case "$SIM_INPUT" in *[!0-9]*|'') echo "invalid sim input"; exit 2 ;; esac
            sim_arg="--sim=$SIM_INPUT"
          fi
          # shellcheck disable=SC2086  # sim_arg is empty or one validated --sim=digits word
          bin/sim-recap-tick $sim_arg >/dev/null
      - name: Re-dispatch for an immediate retry
        if: ${{ !cancelled() && steps.secrets.outputs.configured == 'true' && steps.tick.outputs.redispatch == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sim-recap.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
      - name: Close ssh master
        if: always() && steps.secrets.outputs.configured == 'true'
        run: ssh -O exit ibl-prod 2>/dev/null || true
      - name: Save ops-alert edge state
        if: always() && steps.secrets.outputs.configured == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: '${{ runner.temp }}/sim-recap-state', key: 'sim-recap-ops-alert-${{ github.run_id }}' }
