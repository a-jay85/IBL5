name: Mutation Testing

on:
  schedule:
    - cron: '0 11 * * 1'  # Monday 11am UTC (3am PST, 4am PDT)
  workflow_dispatch:
  pull_request:
    types: [labeled]  # per-PR diff job (required check) lives in mutation-pr.yml

permissions:
  contents: read
  packages: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror-ready:
    name: Mirror CI images
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'mutation-test')
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mirror-ci-images.yml
    with:
      only-missing: true

  mutation:
    name: Infection PHP
    needs: [mirror-ready]
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'mutation-test')
    timeout-minutes: 60

    services:
      mariadb:
        image: ghcr.io/a-jay85/mirror/mariadb:10.11
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ibl5
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Check infection excludes
      working-directory: ibl5
      run: bin/check-infection-excludes

    - name: Setup PHP environment
      uses: ./.github/actions/setup-php-env
      with:
        extensions: mbstring, intl, mysqli, pcov
        coverage: pcov

    - name: Apply migrations
      working-directory: ibl5
      run: bin/run-migrations-ci -h 127.0.0.1 -u root -proot ibl5

    - name: Import seed data
      working-directory: ibl5
      run: mysql -h 127.0.0.1 -u root -proot ibl5 < tests/DatabaseIntegration/Fixtures/db-seed.sql

    - name: Generate coverage for Infection
      working-directory: ibl5
      env:
        DB_HOST: 127.0.0.1
        DB_USER: root
        DB_PASS: root
        DB_NAME: ibl5
      run: |
        mkdir -p coverage
        vendor/bin/phpunit \
          --configuration=phpunit-mutation.xml \
          --coverage-clover coverage/clover.xml \
          --coverage-xml coverage/coverage-xml \
          --log-junit coverage/junit.xml \
          --no-progress

    - name: Run Infection
      working-directory: ibl5
      run: |
        vendor/bin/infection \
          --configuration=infection.json5 \
          --coverage=coverage \
          --skip-initial-tests \
          --show-mutations \
          --no-progress

    - name: Upload mutation reports
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mutation-reports
        path: |
          ibl5/infection.log
          ibl5/infection-report.html
          ibl5/infection-summary.log
        retention-days: 14

    - name: Post summary
      if: always()
      working-directory: ibl5
      run: |
        if [ -f infection-summary.log ]; then
          echo "## Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat infection-summary.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

  notify-mutation-failure:
    name: Notify Mutation Failure
    runs-on: ubuntu-latest
    needs: [mirror-ready, mutation]
    if: ${{ always() && (needs.mutation.result == 'failure' || needs.mirror-ready.result == 'failure') }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Discord message
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf 'Weekly mutation testing FAILED (%s trigger).\n\nMSI dropped below 100%% — an escaped mutant or coverage regression. Check the run: %s' "${{ github.event_name }}" "$RUN_URL")
          printf '%s' "$MSG" > /tmp/discord-msg.txt

      - name: Send Discord DM
        uses: ./.github/actions/notify-discord
        with:
          webhook-url: ${{ secrets.DISCORD_DEV_WEBHOOK_URL }}
