name: ESLint

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    # Workflow-level filter: GitHub skips the whole run (zero runner slots)
    # when no listed path changed. Safe because ESLint is not a required
    # check. Never copy this pattern into a required workflow; see guard R1
    # in bin/check-composite-contracts.
    paths:
      - 'ibl5/tests/e2e/**'
      - 'ibl5/playwright.config.ts'
      - 'ibl5/eslint.config.js'
      - 'ibl5/package.json'
      - 'ibl5/bun.lock'
      - '.github/workflows/eslint.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ESLint lints the e2e spec suite only, so bin/website-affecting is not used.
  # Path scoping lives in on.pull_request.paths above.

  eslint:
    name: ESLint (e2e specs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ibl5/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('ibl5/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install JS dependencies
        working-directory: ibl5
        run: bun install

      - name: Run ESLint
        working-directory: ibl5
        run: bun run lint:e2e
