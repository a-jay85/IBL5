name: Plan checks

# Emits the required status check `Plan checks` (ADR in
# ibl5/docs/decisions/*-plan-checks-ci-from-pr-body.md). It must report on every
# PR: no paths/branches filters, no labeled type, no job-level if:.
# bin/check-composite-contracts P1-P5 enforce this.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

# Every run reads the body through the API at step time, never the event
# payload, so the newest run always holds the newest body. Cancelling an
# older run therefore never drops a newer body.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan-checks:
    name: Plan checks
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Create a local master ref for --since=master rows
      run: git branch --force master origin/master

    - name: Setup PHP environment
      uses: ./.github/actions/setup-php-env

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'

    - name: Install pytest
      run: python -m pip install --upgrade pip pytest pytest-xdist

    - name: Read the current PR body and labels
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        gh api "repos/$REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
        jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.txt"
        jq -r '.labels[].name' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-labels.txt"

    - name: Run plan checks
      run: >-
        bin/lib/plan-checks-block ci
        --body-file "$RUNNER_TEMP/pr-body.txt"
        --labels-file "$RUNNER_TEMP/pr-labels.txt"
